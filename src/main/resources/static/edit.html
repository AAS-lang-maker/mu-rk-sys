<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑榜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #041f50;
            min-height: 100vh;
            color: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* 编辑弹窗样式 */
        .edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(30, 41, 59);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 80px 80px; /* 网格大小，可调整 */
            background-position: center;
        }

        .modal-content {
            background: #1E293B;
            border: 1px solid #fffa9c;
            border-radius: 12px;
            padding: 30px;
            width: 95%;
            max-width: 800px;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(255, 250, 156, 0.3);
        }

        .modal-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-header h3 {
            color: #fffa9c;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #f7fafc;
            font-weight: bold;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #fffa9c;
            border-radius: 6px;
            background: rgba(255, 250, 156, 0.1);
            color: #f7fafc;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:hover {
            background: rgba(255, 250, 156, 0.2);
            border-color: #fff780;
        }

        .form-group input:focus {
            outline: none;
            border-color: #fff780;
            background: rgba(255, 250, 156, 0.25);
            box-shadow: 0 0 0 2px rgba(255, 250, 156, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #fffa9c;
            color: #1a202c;
        }

        .btn-primary:hover {
            background: #fff780;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 250, 156, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #fffa9c;
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f7fafc;
            border: 1px solid #fffa9c;
        }

        .btn-secondary:hover {
            background: rgba(255, 250, 156, 0.2);
            transform: translateY(-2px);
            border-color: #fff780;
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .song-list {
            margin: 20px 0;
            border: 1px solid #fffa9c;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 250, 156, 0.05);
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 250, 156, 0.1);
            border-bottom: 1px solid rgba(255, 250, 156, 0.2);
            transition: all 0.3s ease;
        }

        .song-item:hover {
            background: rgba(255, 250, 156, 0.2);
            transform: translateX(2px);
        }

        .song-item.selected {
            background: rgba(255, 250, 156, 0.3);
        }

        .song-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-name {
            font-weight: bold;
            color: #f7fafc;
            font-size: 16px;
        }

        .song-rank {
            color: #fffa9c;
            font-weight: bold;
            font-size: 16px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 20px;
            cursor: pointer;
            padding: 0 15px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            color: #ff6666;
            transform: scale(1.1);
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        .hint-text {
            color: rgba(247, 250, 252, 0.6);
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* 歌手选择弹窗 */
        .singer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }

        .singer-modal.show {
            display: flex;
        }

        .singer-content {
            background: #1E293B;
            border: 1px solid #fffa9c;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(255, 250, 156, 0.3);
        }

        .singer-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .singer-header h3 {
            color: #fffa9c;
            font-size: 18px;
        }

        .singer-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #fffa9c;
            border-radius: 8px;
            background: rgba(255, 250, 156, 0.05);
        }

        .singer-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 250, 156, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            color: #f7fafc;
        }

        .singer-item:hover {
            background: rgba(255, 250, 156, 0.2);
            transform: translateX(5px);
        }

        .singer-item:last-child {
            border-bottom: none;
        }

        .singer-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .singer-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<!-- 编辑弹窗 -->
<div class="edit-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>榜单更新</h3>
        </div>

        <div class="form-group">
            <label for="rankingTitle">榜单标题</label>
            <input type="text" id="rankingTitle" placeholder="请输入榜单标题">
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="selectSingerBtn" disabled>选择歌手</button>
            <button class="btn btn-primary" id="addSongBtn">新增歌曲排名行</button>
        </div>

        <p class="hint-text">提示：请先选择要编辑的歌曲行</p>

        <div class="song-list" id="songList">
            <div class="song-item">
                <div class="song-info">
                    <span class="song-name">歌曲1</span>
                    <span class="song-rank">1</span>
                </div>
                <button class="delete-btn">×</button>
            </div>
            <div class="song-item">
                <div class="song-info">
                    <span class="song-name">歌曲2</span>
                    <span class="song-rank">2</span>
                </div>
                <button class="delete-btn">×</button>
            </div>
            <div class="song-item">
                <div class="song-info">
                    <span class="song-name">歌曲3</span>
                    <span class="song-rank">3</span>
                </div>
                <button class="delete-btn">×</button>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelBtn">取消</button>
            <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
    </div>
</div>

<!-- 歌手选择弹窗 -->
<div class="singer-modal" id="singerModal">
    <div class="singer-content">
        <div class="singer-header">
            <h3>选择歌手</h3>
        </div>

        <div class="singer-list" id="singerList">
            <div class="singer-item">周杰伦</div>
            <div class="singer-item">林俊杰</div>
            <div class="singer-item">陈奕迅</div>
            <div class="singer-item">邓紫棋</div>
            <div class="singer-item">薛之谦</div>
            <div class="singer-item">李荣浩</div>
            <div class="singer-item">毛不易</div>
            <div class="singer-item">华晨宇</div>
        </div>

        <div class="singer-footer">
            <button class="btn btn-secondary" id="closeSingerModalBtn">关闭</button>
        </div>
    </div>
</div>

<script>
    let selectedSongIndex = -1;

    // 选择歌曲行
    const songItems = document.querySelectorAll('.song-item');
    songItems.forEach((item, index) => {
        item.addEventListener('click', function () {
            songItems.forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            selectedSongIndex = index;
            document.getElementById('selectSingerBtn').disabled = false;
        });
    });

    // 删除歌曲
    const deleteBtns = document.querySelectorAll('.delete-btn');
    deleteBtns.forEach((btn, index) => {
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const songItem = this.closest('.song-item');
            songItem.remove();
            selectedSongIndex = -1;
            document.getElementById('selectSingerBtn').disabled = true;
        });
    });

    // 选择歌手按钮
    document.getElementById('selectSingerBtn').addEventListener('click', function () {
        if (selectedSongIndex === -1) {
            alert('请先选择要编辑的歌曲行');
            return;
        }
        document.getElementById('singerModal').classList.add('show');
    });

    // 新增歌曲排名行
    document.getElementById('addSongBtn').addEventListener('click', function () {
        const songList = document.getElementById('songList');
        const currentCount = songList.querySelectorAll('.song-item').length;

        const newSongItem = document.createElement('div');
        newSongItem.className = 'song-item';
        newSongItem.innerHTML = `
                <div class="song-info">
                    <span class="song-name">新歌曲${currentCount + 1}</span>
                    <span class="song-rank">${currentCount + 1}</span>
                </div>
                <button class="delete-btn">×</button>
            `;

        newSongItem.addEventListener('click', function () {
            document.querySelectorAll('.song-item').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            selectedSongIndex = currentCount;
            document.getElementById('selectSingerBtn').disabled = false;
        });

        newSongItem.querySelector('.delete-btn').addEventListener('click', function (e) {
            e.stopPropagation();
            newSongItem.remove();
            selectedSongIndex = -1;
            document.getElementById('selectSingerBtn').disabled = true;
        });

        songList.appendChild(newSongItem);
    });

    // 歌手选择
    const singerItems = document.querySelectorAll('.singer-item');
    singerItems.forEach(item => {
        item.addEventListener('click', function () {
            const singerName = this.textContent;
            if (selectedSongIndex !== -1) {
                const songItems = document.querySelectorAll('.song-item');
                const songNameElement = songItems[selectedSongIndex].querySelector('.song-name');
                songNameElement.textContent = singerName;
            }
            document.getElementById('singerModal').classList.remove('show');
        });
    });

    // 关闭歌手选择弹窗
    document.getElementById('closeSingerModalBtn').addEventListener('click', function () {
        document.getElementById('singerModal').classList.remove('show');
    });

    // 保存按钮
    document.getElementById('saveBtn').addEventListener('click', function () {
        const title = document.getElementById('rankingTitle').value;
        if (!title) {
            alert('请输入榜单标题');
            return;
        }
        alert('榜单保存成功！');
    });

    // 取消按钮
    document.getElementById('cancelBtn').addEventListener('click', function () {
        alert('取消编辑');
    });
</script>
</body>

</html>
