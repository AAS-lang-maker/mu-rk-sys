<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/axios.min.js}"></script>
    <script th:src="@{/js/request.js}"></script>
    <title>我的收藏</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo">
    <link rel="stylesheet" th:href="@{/player/music-player.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: #f7fafc;
            padding: 20px;
            background:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    #0f172a;
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        .sidebar {
            position: fixed;
            left: 0px;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0 12px 12px 0;
            padding: 20px;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }
        .sidebar.collapsed{
            left: -120px;
        }
        .sidebar:hover {
            left: 0;
        }

        .sidebar-btn {
            background-color: #fffa9c;
            color: #1a202c;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            pointer-events: auto;
        }

        .sidebar-btn:hover {
            background-color: #fff780;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 250, 156, 0.4);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            position: relative;
            z-index: 1;
            pointer-events: auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 3px solid #fffa9c;
            box-shadow: 0 4px 12px rgba(255, 250, 156, 0.3);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 250, 156, 0.5);
        }

        .user-details h2 {
            font-size: 24px;
            color: #fffa9c;
            margin-bottom: 5px;
        }

        .user-details p {
            font-size: 14px;
            color: rgba(247, 250, 252, 0.7);
        }

        .rankings-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            pointer-events: auto;
        }

        .rankings-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .ranking-content {
            flex: 1;
        }

        .ranking-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(10px);
            border-left-color: #fffa9c;
        }

        .ranking-item h3 {
            color: #fffa9c;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .ranking-item p {
            color: rgba(247, 250, 252, 0.7);
            font-size: 14px;
            line-height: 1.5;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            pointer-events: auto;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 250, 156, 0.3);
            color: #f7fafc;
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #fffa9c;
            color: #1a202c;
            transform: translateY(-2px);
        }

        .pagination button.active {
            background-color: #fffa9c;
            color: #1a202c;
            font-weight: bold;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                margin-bottom: 20px;
            }

            .avatar {
                width: 60px;
                height: 60px;
            }

            .rankings-container {
                padding: 20px;
            }
        }

        .song-list {
            margin-top: 15px;
            padding-left: 0;
            pointer-events: auto;
        }

        .song-list h4 {
            color: #fffa9c;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .song-list ul {
            list-style: none;
            padding: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 10px;
        }

        .song-list li {
            margin: 8px 0;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 250, 156, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .song-list li:last-child {
            border-bottom: none;
        }

        .song-list li:hover {
            background: rgba(255, 250, 156, 0.05);
        }
        .song-info{
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1; /* 新增：让歌曲信息占满剩余空间 */
        }
        .song-name {
            color: #f7fafc;
            font-size: 15px;
        }
        .singer-name{
            color: #d1d5db;
            font-size: 15px;
        }

        .song-rank {
            color: #fffa9c;
            font-size: 15px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(255, 250, 156, 0.1);
            border-radius: 4px;
            margin-right: 10px; /* 新增：排名和播放按钮间距 */
        }

        /* 新增：播放按钮和排名的容器样式 */
        .song-actions {
            display: flex;
            align-items: center;
        }

        /* 播放按钮样式（和我的榜单页保持一致） */
        .play-btn {
            background: rgba(255, 250, 156, 0.2);
            border: 1px solid #fffa9c;
            color: #fffa9c;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            padding-left: 2px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 2;
        }
        .play-btn:hover {
            background: #fffa9c;
            color: #1a202c;
            transform: scale(1.1);
        }

        /* 提示框样式（复用我的榜单页） */
        #errorAlert {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff4444;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        #successAlert {
            display: none;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #00C851;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        /* 播放器容器样式（和我的榜单页保持一致） */
        #music-player-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            z-index: 1000;
        }

        /* 评论区样式（和我的榜单页保持一致） */
        .comment-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 250, 156, 0.1);
            padding-top: 15px;
            pointer-events: auto;
        }

        .comment-toggle {
            background: rgba(255, 250, 156, 0.1);
            border: 1px solid rgba(255, 250, 156, 0.3);
            color: #fffa9c;
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            margin-bottom: 15px;
            cursor: pointer;
            pointer-events: auto;
        }

        .comment-toggle:hover {
            background: rgba(255, 250, 156, 0.2);
            transform: translateY(-2px);
        }

        .comment-container {
            display: none;
            animation: fadeIn 0.3s ease;
            pointer-events: auto;
        }

        .comment-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-input-area {
            margin-bottom: 20px;
        }

        .comment-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 250, 156, 0.3);
            border-radius: 8px;
            color: #f7fafc;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .comment-input:focus {
            outline: none;
            border-color: #fffa9c;
            box-shadow: 0 0 10px rgba(255, 250, 156, 0.3);
        }

        .comment-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .comment-submit {
            background: #fffa9c;
            color: #1a202c;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }

        .comment-submit:hover {
            background: #fff780;
            transform: translateY(-2px);
        }

        .comment-list {
            margin-top: 20px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .comment-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-username {
            color: #fffa9c;
            font-weight: bold;
            font-size: 14px;
        }

        .comment-time {
            color: rgba(247, 250, 252, 0.5);
            font-size: 12px;
        }

        .comment-content {
            color: #f7fafc;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .comment-actions-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 评论删除按钮核心样式 */
        .comment-delete-btn {
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255, 99, 71, 0.7);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .comment-delete-btn:hover {
            color: #ff6347;
            background-color: rgba(255, 99, 71, 0.1);
            transform: translateY(-1px);
        }

        .comment-delete-btn:active {
            transform: translateY(0);
            opacity: 0.8;
        }

        .comment-delete-btn::before {
            content: "🗑️";
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(247, 250, 252, 0.6);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
    <script th:src="@{/player/music-player.js}"></script>
</head>

<body>
<!-- 提示框元素 -->
<div id="errorAlert"></div>
<div id="successAlert"></div>

<!-- 播放器容器（和我的榜单页一致） -->
<div id="music-player-container"></div>

<div class="sidebar">
    <button class="sidebar-btn" id="btn-goToPu">返回主页</button>
    <button class="sidebar-btn" id="btn-reLogin">重新登录</button>
    <button class="sidebar-btn" id="btn-goToHome">返回首页</button>
</div>

<div class="container">
    <div class="header">
        <div class="user-info">
            <img
                    src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=user%20avatar%20profile%20picture%20friendly%20face&image_size=square"
                    alt="用户头像" class="avatar">
            <div class="user-details">
                <h2 th:text="${username}">用户名</h2>
                <p>我的收藏管理</p>
            </div>
        </div>
    </div>

    <div class="rankings-container">
        <div th:each="ranking, stat : ${myloveSongs.list}" class="ranking-item" th:data-rank-id="${ranking.rankId}">
            <div class="ranking-content">
                <!-- 榜单基本信息 -->
                <h3 th:text="${ranking.rankName}">榜单标题</h3>
                <p th:text="|更新于: ${ranking.publishTime}|">最后更新时间</p>

                <!-- 榜单下的歌曲列表（修复播放按钮布局） -->
                <div class="song-list">
                    <h4>歌曲列表</h4>
                    <ul>
                        <li th:each="song : ${ranking.rankSongList}" th:data-song-id="${song.songId}">
                            <div class="song-info">
                                <span class="song-name" th:text="${song?.songName}">歌曲名称</span>
                                <span class="singer-name" th:text="${song.singerName}">歌手名称</span>
                            </div>
                            <!-- 修复：将排名和播放按钮放在同一个容器中 -->
                            <div class="song-actions">
                                <span class="song-rank" th:text="${song?.ranking}">排名</span>
                                <!-- 播放按钮：保持原有data属性，样式和我的榜单页一致 -->
                                <button class="play-btn"
                                        th:data-song-id="${song.songId}"
                                        th:data-song-name="${song.songName}"
                                        th:data-singer-name="${song.singerName}">
                                    &#9658;
                                </button>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- 评论区（和我的榜单页一致） -->
                <div class="comment-section">
                    <button class="comment-toggle" th:data-rank-id="${ranking.rankId}">
                        查看评论
                    </button>
                    <div class="comment-container" th:id="|comment-container-${ranking.rankId}|">
                        <div class="comment-input-area">
                            <textarea class="comment-input" th:id="|comment-input-${ranking.rankId}|"
                                      placeholder="写下你的评论..."></textarea>
                            <div class="comment-actions">
                                <button class="comment-submit" th:data-rank-id="${ranking.rankId}">
                                    发表评论
                                </button>
                            </div>
                        </div>
                        <div class="comment-list" th:id="|comment-list-${ranking.rankId}|">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pagination" th:if="${myloveSongs != null}">
            <button th:disabled="${myloveSongs.pageNum == 1}"
                    th:data-page="${myloveSongs.pageNum - 1}">上一页</button>

            <button th:each="i : ${#numbers.sequence(1, myloveSongs.pages)}"
                    th:class="${myloveSongs.pageNum == i ? 'active' : ''}"
                    th:data-page="${i}"
                    th:text="${i}">1</button>

            <button th:disabled="${myloveSongs.pageNum == myloveSongs.pages}"
                    th:data-page="${myloveSongs.pageNum + 1}">下一页</button>
        </div>

        <div class="empty-state"
             th:if="${myloveSongs == null or myloveSongs.list == null or myloveSongs.list.isEmpty()}">
            <h3>暂无收藏</h3>
            <p>您还没有收藏任何歌单</p>
        </div>
    </div>

    <script>
        // ===================== 全局核心配置（完全复用我的榜单页）=====================
        function getUrlParam(paramName) {
            const reg = new RegExp("(^|&)" + paramName + "=([^&]*)(&|$)");
            const paramMatch = window.location.search.substr(1).match(reg);
            return paramMatch ? decodeURIComponent(paramMatch[2]) : null;
        }

        function getUserIdFromToken(token) {
            if (!token) return null;
            try {
                const payload = token.split('.')[1];
                const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
                const payloadObj = JSON.parse(decodedPayload);
                return payloadObj.userId || payloadObj.uid || null;
            } catch (error) {
                console.error("解析Token失败:", error);
                return null;
            }
        }

        let token = getUrlParam("token") || localStorage.getItem('token') || '';
        let userId = getUrlParam("userId") || getUrlParam("user_id") || getUserIdFromToken(token) || localStorage.getItem('user_id') || '';
        let musicPlayer = null;

        function showErrorTip(msg) {
            let el = document.getElementById('errorAlert');
            if (!el) {
                el = document.createElement('div');
                el.id = 'errorAlert';
                el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#ff4444;color:#fff;border-radius:4px;z-index:9999;';
                document.body.appendChild(el);
            }
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function showSuccessTip(msg) {
            let el = document.getElementById('successAlert');
            if (!el) {
                el = document.createElement('div');
                el.id = 'successAlert';
                el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#00C851;color:#fff;border-radius:4px;z-index:9999;';
                document.body.appendChild(el);
            }
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function padStartCompat(str, length, padChar) {
            str = str.toString();
            while (str.length < length) {
                str = padChar + str;
            }
            return str;
        }

        // ===================== 播放器核心逻辑（完全复用我的榜单页）=====================
        function initMusicPlayer() {
            if (musicPlayer) return;
            try {
                musicPlayer = new MusicPlayer({
                    container: 'music-player-container',
                    token: token,
                    userId: userId
                });
                console.log("播放器初始化成功");
            } catch (e) {
                console.error("播放器初始化失败:", e);
                showErrorTip("播放器加载失败：" + e.message);
            }
        }

        function playSong(song) {
            if (!song) {
                showErrorTip("歌曲信息为空！");
                return;
            }
            if (!musicPlayer) {
                initMusicPlayer();
            }
            try {
                musicPlayer.playSong(song);
                showSuccessTip(`开始播放：${song.songName}`);
            } catch (e) {
                console.error("播放歌曲失败:", e);
                showErrorTip("播放失败：" + e.message);
            }
        }

        function playSongFromData(btn) {
            const songId = btn.dataset.songId;
            const songName = btn.dataset.songName;
            const singerName = btn.dataset.singerName;

            if (!songId) {
                showErrorTip("歌曲ID为空，无法播放！");
                return;
            }

            playSong({
                songId: songId,
                songName: songName || "未知歌曲",
                singerName: singerName || "未知歌手"
            });
        }

        // ===================== 评论区功能（完全复用我的榜单页）=====================
        function toggleComments(rankId) {
            const container = document.getElementById(`comment-container-${rankId}`);
            if (!container) {
                showErrorTip("评论容器未找到！");
                return;
            }
            const toggleBtn = container.previousElementSibling;

            if (container.classList.contains('show')) {
                container.classList.remove('show');
                toggleBtn.textContent = '查看评论';
            } else {
                container.classList.add('show');
                toggleBtn.textContent = '收起评论';
                loadComments(rankId);
            }
        }

        function loadComments(rankId) {
            console.log('加载评论列表，rankId:', rankId);
            const commentList = document.getElementById(`comment-list-${rankId}`);
            if (!commentList) return;

            if (!token) {
                commentList.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">请先登录后查看评论</p>';
                return;
            }

            commentList.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">加载中...</p>';

            axios.get(`/music/api/rank/list`, {
                params: {
                    token: token,
                    rankId: rankId,
                    userId: userId
                }
            })
                .then(response => {
                    console.log('加载评论响应:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        const comments = response.data.data || response.data;
                        renderComments(commentList, comments);
                    } else {
                        commentList.innerHTML = `<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">查询评论失败：${response.data.msg || '未知错误'}</p>`;
                        console.error('评论查询失败:', response.data);
                    }
                })
                .catch(error => {
                    console.error('加载评论失败:', error);
                    commentList.innerHTML = `<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">加载评论失败：${error.response?.data?.msg || error.message}</p>`;
                });
        }

        function renderComments(container, comments) {
            if (!comments || comments.length === 0) {
                container.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">暂无评论</p>';
                return;
            }

            container.innerHTML = '';
            comments.forEach(comment => {
                const commentItem = document.createElement('div');
                commentItem.className = 'comment-item';

                commentItem.innerHTML = `
                <div class="comment-header">
                    <span class="comment-username">${comment.username || '匿名用户'}</span>
                    <span class="comment-time">${formatTime(comment.comTime)}</span>
                </div>
                <div class="comment-content">${comment.comContent || ''}</div>
                <div class="comment-actions-bar">
                    ${comment.userId === parseInt(userId) ?
                    `<button class="comment-delete-btn" data-comment-id="${comment.comId}">删除</button>` : ''
                }
                </div>
            `;

                container.appendChild(commentItem);
            });
        }

        function submitComment(rankId) {
            console.log('提交评论,rankId:', rankId);
            const input = document.getElementById(`comment-input-${rankId}`);
            if (!input) {
                showErrorTip("评论输入框未找到！");
                return;
            }
            const content = input.value.trim();

            if (!content) {
                showErrorTip("评论内容不能为空！");
                return;
            }

            if (!token || !userId || isNaN(userId)) {
                showErrorTip("请先登录后再评论！");
                return;
            }

            axios.post(`/music/api/rank/pubcomment`, {
                rankId: rankId,
                userId: userId,
                content: content,
                parentId: null
            }, {
                params: { token: token }
            })
                .then(response => {
                    console.log('提交评论成功:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        showSuccessTip("评论发表成功！");
                        input.value = '';
                        loadComments(rankId);
                    } else {
                        showErrorTip("评论发表失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('提交评论失败:', error);
                    showErrorTip("评论发表失败：" + (error.response?.data?.msg || error.message));
                });
        }

        function deleteComment(commentId) {
            console.log('删除评论，commentId:', commentId);

            if (!confirm('确定要删除这条评论吗？')) {
                return;
            }

            axios.delete(`/music/api/rank/deleteComment`, {
                params: {
                    token: token,
                    comId: commentId,
                    userId: userId
                }
            })
                .then(response => {
                    console.log('删除评论成功:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        showSuccessTip("删除评论成功！");
                        const commentItem = document.querySelector(`[data-comment-id="${commentId}"]`).closest('.comment-item');
                        const commentContainer = commentItem.closest('[id^="comment-container-"]');
                        const rankId = commentContainer.id.replace('comment-container-', '');
                        loadComments(rankId);
                    } else {
                        showErrorTip("删除评论失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('删除评论失败:', error);
                    showErrorTip("删除评论失败：" + (error.response?.data?.msg || error.message));
                });
        }

        function formatTime(time) {
            if (!time) return '';
            const date = new Date(time);
            if (isNaN(date.getTime())) return '未知时间';
            const year = date.getFullYear();
            const month = padStartCompat(date.getMonth() + 1, 2, '0');
            const day = padStartCompat(date.getDate(), 2, '0');
            const hour = padStartCompat(date.getHours(), 2, '0');
            const minute = padStartCompat(date.getMinutes(), 2, '0');
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        // ===================== 收藏页业务逻辑（修复核心问题）=====================
        (function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('token') || '';
                const urlUid = urlParams.get('user_id') || urlParams.get('userId') || '';
                const urlUserName = urlParams.get('userName') || urlParams.get('username') || '';
                const urlCategory = urlParams.get('category') || '';
                const urlSuccess = urlParams.get('success') || '';

                localStorage.setItem('token', urlToken);
                localStorage.setItem('user_id', urlUid);
                localStorage.setItem('userName', urlUserName);
                localStorage.setItem('category', urlCategory);
                localStorage.setItem('success', urlSuccess);

                console.log('✅ 收藏页初始化完成，参数：', {
                    token: urlToken,
                    userId: urlUid,
                    category: urlCategory,
                    success: urlSuccess
                });
            } catch (err) {
                console.error('❌ 收藏页初始化出错：', err);
            }
        })();

        function goToHome() {
            try {
                let token = localStorage.getItem('token') || '';
                let user_id = localStorage.getItem('user_id') || '';
                let userName = localStorage.getItem('userName') || '';

                if (!token) {
                    const urlParams = new URLSearchParams(window.location.search);
                    token = urlParams.get('token') || '';
                    user_id = urlParams.get('user_id') || urlParams.get('userId') || '';
                    userName = urlParams.get('userName') || urlParams.get('username') || '';

                    if (token) localStorage.setItem('token', token);
                    if (user_id) localStorage.setItem('user_id', user_id);
                    if (userName) localStorage.setItem('userName', userName);
                }

                if (!token) {
                    alert('登录信息已失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                const params = new URLSearchParams();
                if (token) params.append('token', token);
                if (user_id) params.append('userId', user_id);
                if (userName) params.append('userName', userName);

                const targetUrl = `/music/index.html?${params.toString()}`;
                window.location.href = targetUrl;

            } catch (err) {
                console.error('❌ 跳转首页出错：', err);
                alert('跳转失败，请刷新页面重试！');
            }
        }

        // 修复：返回主页函数 - 跳转页面路径（不是接口路径）
        function goToPu() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token') || localStorage.getItem('token') || '';
                const userId = urlParams.get('userId') || urlParams.get('user_id') || localStorage.getItem('user_id') || '';
                const category = urlParams.get('category') || localStorage.getItem('category') || '';
                const success = urlParams.get('success') || localStorage.getItem('success') || '';

                console.log('📌 跳转前参数：', { token, userId, category, success });

                if (!token || !userId) {
                    alert('登录信息失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                const params = new URLSearchParams();
                params.append('token', token);
                params.append('userId', userId);
                if (category) params.append('category', category);
                if (success) params.append('success', success);

                // 修复：跳转页面路径（改为.html页面，不是/api接口）
                // 请根据你的实际主页页面路径调整，示例使用/music/publish.html
                const targetUrl = `/music/api/rank/publish?${params.toString()}`;
                console.log('📌 返回主页跳转URL：', targetUrl);
                window.location.href = targetUrl;

            } catch (err) {
                console.error('❌ 跳转出错：', err);
                alert('跳转失败，请刷新重试！');
            }
        }

        function goToPage(page) {
            const currentToken = localStorage.getItem('token') || getUrlParam('token');
            const currentUserId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
            window.location.href = `/music/api/mine/mylove?pageNum=${page}&token=${encodeURIComponent(currentToken)}&userId=${encodeURIComponent(currentUserId)}`;
        }

        // ===================== 事件委托绑定（强化播放按钮事件）=====================
        document.addEventListener('DOMContentLoaded', function() {
            // 强制初始化播放器（确保加载）
            initMusicPlayer();

            // 1. 侧边栏按钮绑定
            document.getElementById('btn-goToPu').addEventListener('click', goToPu);
            document.getElementById('btn-reLogin').addEventListener('click', function() {
                window.location.href='/music/login.html';
            });
            document.getElementById('btn-goToHome').addEventListener('click', goToHome);

            // 2. 播放按钮绑定（强化事件委托，确保能触发）
            document.addEventListener('click', function(e) {
                const playBtn = e.target.closest('.play-btn');
                if (playBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('播放按钮点击，歌曲ID：', playBtn.dataset.songId); // 调试日志
                    playSongFromData(playBtn);
                }
            }, true); // 捕获阶段触发，确保不被阻止

            // 3. 评论切换按钮绑定（事件委托）
            document.addEventListener('click', function(e) {
                const commentToggle = e.target.closest('.comment-toggle');
                if (commentToggle) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = commentToggle.dataset.rankId;
                    toggleComments(rankId);
                }
            });

            // 4. 评论提交按钮绑定（事件委托）
            document.addEventListener('click', function(e) {
                const commentSubmit = e.target.closest('.comment-submit');
                if (commentSubmit) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = commentSubmit.dataset.rankId;
                    submitComment(rankId);
                }
            });

            // 5. 评论删除按钮绑定（事件委托）
            document.addEventListener('click', function(e) {
                const commentDelete = e.target.closest('.comment-delete-btn');
                if (commentDelete) {
                    e.preventDefault();
                    e.stopPropagation();
                    const commentId = commentDelete.dataset.commentId;
                    deleteComment(commentId);
                }
            });

            // 6. 分页按钮绑定（事件委托）
            document.addEventListener('click', function(e) {
                const pageBtn = e.target.closest('.pagination button');
                if (pageBtn && !pageBtn.disabled) {
                    e.preventDefault();
                    e.stopPropagation();
                    const page = pageBtn.dataset.page;
                    goToPage(page);
                }
            });

            // 校验登录状态
            if (!token || !userId || isNaN(userId)) {
                showErrorTip('登录信息失效，请重新登录');
                setTimeout(() => window.location.href = '/music/login.html', 1500);
            }
        });
    </script>
