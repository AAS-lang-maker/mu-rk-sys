<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/axios.min.js}"></script>
    <title>我的收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:'Arial', sans-serif;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            background:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    #0f172a;
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #fffa9c;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
        }

        .rankings-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 235, 59, 0.5);
        }

        .ranking-content h3 {
            color: #fffa9c;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ranking-content p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .song-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
        }

        .song-list h4 {
            color: #fffa9c;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .song-list ul {
            list-style: none;
        }

        .song-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .song-list li:last-child {
            border-bottom: none;
        }
         .song-info{
           display: flex;
           align-items: center;
           gap: 15px;
         }
        .song-name {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }
        .singer-name{
            color:#d1d5db;
            font-size: 15px;
        }
        .song-rank {
            color: #fffa9c;
            font-size: 15px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(255, 250, 156, 0.1);
            border-radius: 4px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pagination button {
            background: rgba(255, 250, 156, 0.9);
            color: #333333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0 10px;
        }

        .pagination button:hover {
            background: #fffa9c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .pagination button:disabled {
            background: rgba(255, 250, 156, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .pagination button.active {
            background: #fffa9c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .page-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin: 0 20px;
        }

        /* 侧边栏按钮样式 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
        }

        .sidebar-btn {
            background: rgba(255, 250, 156, 0.9);
            color: #333333;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            transform: translateX(0);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .sidebar-btn:hover {
            background: #fffa9c;
            transform: translateX(10px) translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* 所有按钮的点击动画 */
        .pagination button,
        .sidebar-btn {
            position: relative;
            overflow: hidden;
        }

        .pagination button:active,
        .sidebar-btn:active {
            animation: btnClick 0.3s ease;
        }

        @keyframes btnClick {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .sidebar {
                top: auto;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                padding: 10px;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 30px;
            }

            .sidebar-btn {
                padding: 10px 20px;
                font-size: 14px;
                border-radius: 20px;
            }

            .sidebar-btn:hover {
                transform: translateX(5px) translateY(-2px);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>

<body>
<!-- 侧边栏按钮 -->
<div class="sidebar">
    <button class="sidebar-btn" onclick="goToPub()">返回主页</button>
    <button class="sidebar-btn" onclick="window.location.href='/music/login.html'">重新登录</button>
    <button class="sidebar-btn" onclick="goToInd()">返回首页</button>
</div>
<div class="container">
    <div class="header">
        <h1>我的收藏</h1>
        <p>查看您收藏的歌单</p>
    </div>


    <div class="rankings-container">
        <div th:each="ranking, stat : ${myloveSongs.list}" class="ranking-item">
            <div class="ranking-content">
                <!-- 榜单基本信息 -->
                <h3 th:text="${ranking.rankName}">榜单标题</h3>
                <p th:text="|更新于: ${ranking.publishTime}|">最后更新时间</p>


                <!-- 榜单下的歌曲列表 -->
                <div class="song-list">
                    <h4>歌曲列表</h4>
                    <ul>
                        <li th:each="song : ${ranking.rankSongList}">
                            <div class="song-info">
                                <span class="song-name" th:text="${song.songName}">歌曲名称</span>
                                <span class="singer-name" th:text="${song.singerName}">歌手名称</span>
                            </div>
                            <span class="song-rank" th:text="${song.ranking}">排名</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 总的分页控件 -->
        <div class="pagination" th:if="${myloveSongs != null}">
            <button th:disabled="${myloveSongs.pageNum == 1}"
                    th:onclick="|goToPage(${myloveSongs.pageNum - 1})|">上一页</button>

            <button th:each="i : ${#numbers.sequence(1, myloveSongs.pages)}"
                    th:class="${myloveSongs.pageNum == i ? 'active' : ''}" th:onclick="|goToPage(${i})|"
                    th:text="${i}">1</button>

            <button th:disabled="${myloveSongs.pageNum == myloveSongs.pages}"
                    th:onclick="|goToPage(${myloveSongs.pageNum + 1})|">下一页</button>
        </div>

        <div class="empty-state"
             th:if="${myloveSongs == null or myloveSongs.list == null or myloveSongs.list.isEmpty()}">
            <h3>暂无收藏</h3>
            <p>您还没有收藏任何歌单</p>
        </div>
    </div>
</div>

<script>
    // 初始化代码，从 URL 中获取参数并存储到 localStorage
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        const urlUid = urlParams.get('userId') || urlParams.get('user_id');

        // 强制把 URL 里的参数更新到 localStorage
        if (urlToken) localStorage.setItem('token', urlToken);
        if (urlUid) localStorage.setItem('user_id', urlUid);

        console.log('✅ 收藏页面初始化完成，参数已同步到 localStorage：', {
            token: localStorage.getItem('token'),
            user_id: localStorage.getItem('user_id')
        });
    })();
    function goToPage(page) {
        const currentToken = localStorage.getItem('token') || getUrlParam('token');
        const currentUserId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
        window.location.href = `/music/api/mine/mylove?pageNum=${page}&token=${encodeURIComponent(currentToken)}&userId=${encodeURIComponent(currentUserId)}`;
    }

    // 获取 URL 参数的函数
    function getUrlParam(paramName) {
        const searchParams = new URLSearchParams(window.location.search);
        return searchParams.get(paramName);
    }

    // 禁用状态的分页按钮点击事件
    document.addEventListener('DOMContentLoaded', function () {
        const pageBtns = document.querySelectorAll('.pagination button');
        pageBtns.forEach(btn => {
            if (btn.hasAttribute('disabled')) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                });
            }
        });
    });
    function goToInd() {
        try {
            // 1. 从localStorage读取参数（加默认值，避免undefined，改为userName）
            let token = localStorage.getItem('token') || '';
            let user_id = localStorage.getItem('user_id') || '';
            let userName = localStorage.getItem('userName') || ''; // 改为userName

            console.log('📌 跳转前读取的参数：', { token, user_id, userName }); // 改为userName

            // 2. 如果localStorage为空，从URL恢复（兼容参数名，优先读userName）
            if (!token) {
                const urlParams = new URLSearchParams(window.location.search);
                token = urlParams.get('token') || '';
                user_id = urlParams.get('user_id') || urlParams.get('userId') || '';
                userName = urlParams.get('userName') || urlParams.get('username') || ''; // 兼容原小写，改为userName

                // 恢复后存回localStorage（统一存为userName）
                if (token) localStorage.setItem('token', token);
                if (user_id) localStorage.setItem('user_id', user_id);
                if (userName) localStorage.setItem('userName', userName); // 改为userName

                console.log('📌 从URL恢复参数：', { token, user_id, userName }); // 改为userName
            }

            // 3. 校验token（为空才跳登录，避免无意义跳转）
            if (!token) {
                alert('登录信息已失效，请重新登录');
                window.location.href = '/music/login.html';
                return;
            }

            // 4. 拼接URL（确保参数不为空，避免URL格式错误，参数名改为userName）
            const params = new URLSearchParams();
            if (token) params.append('token', token);
            if (user_id) params.append('userId', user_id); // 统一用userId，和首页保持一致
            if (userName) params.append('userName', userName); // 改为userName

            const targetUrl = `/music/index.html?${params.toString()}`;
            console.log('📌 最终跳转URL：', targetUrl);

            // 5. 执行跳转（强制跳转，避免被其他逻辑拦截）
            window.location.href = targetUrl;

        } catch (err) {
            // 捕获所有错误，打印出来，避免按钮无响应
            console.error('❌ 跳转首页出错：', err);
            alert('跳转失败，请刷新页面重试！');
        }
    }

    // 修复后的返回主页函数（原goToPu逻辑，仅改函数名为goToPublish）
    function goToPub() {
        try {
            // 1. 双来源读取参数：优先URL，其次localStorage（确保不丢）
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token') || localStorage.getItem('token') || '';
            const userId = urlParams.get('userId') || urlParams.get('user_id') || localStorage.getItem('user_id') || '';
            const category = urlParams.get('category') || localStorage.getItem('category') || ''; // 读取category
            const success = urlParams.get('success') || localStorage.getItem('success') || '';   // 读取success

            console.log('📌 跳转前参数：', { token, userId, category, success });

            // 2. 校验核心参数，缺失则提示
            if (!token || !userId) {
                alert('登录信息失效，请重新登录');
                window.location.href = '/music/login.html';
                return;
            }

            // 3. 拼接URL：和你正常主页路径一致，包含所有参数
            const params = new URLSearchParams();
            params.append('token', token);        // 必带
            params.append('userId', userId);      // 必带
            if (category) params.append('category', category); // 携带category
            if (success) params.append('success', success);    // 携带success

            // 替换成你实际的主页路径（和截图里的publish路径一致）
            const targetUrl = `/music/api/rank/publish?${params.toString()}`;
            console.log('📌 最终跳转URL：', targetUrl);

            // 4. 强制跳转（确保执行）
            window.location.href = targetUrl;

        } catch (err) {
            console.error('❌ 跳转出错：', err);
            alert('跳转失败，请刷新重试！');
        }
    }
</script>
</body>

</html>
