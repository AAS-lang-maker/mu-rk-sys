<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/axios.min.js}"></script>
    <title>我的收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:'Arial', sans-serif;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            background:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    #0f172a;
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #fffa9c;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
        }

        .rankings-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 235, 59, 0.5);
        }

        .ranking-content h3 {
            color: #fffa9c;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ranking-content p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .song-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
        }

        .song-list h4 {
            color: #fffa9c;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .song-list ul {
            list-style: none;
        }

        .song-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .song-list li:last-child {
            border-bottom: none;
        }

        .song-name {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .song-rank {
            color: #fffa9c;
            font-weight: bold;
            font-size: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pagination button {
            background: rgba(255, 250, 156, 0.9);
            color: #333333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0 10px;
        }

        .pagination button:hover {
            background: #fffa9c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .pagination button:disabled {
            background: rgba(255, 250, 156, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .pagination button.active {
            background: #fffa9c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .page-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin: 0 20px;
        }

        /* 侧边栏按钮样式 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
        }

        .sidebar-btn {
            background: rgba(255, 250, 156, 0.9);
            color: #333333;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            transform: translateX(0);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .sidebar-btn:hover {
            background: #fffa9c;
            transform: translateX(10px) translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* 所有按钮的点击动画 */
        .pagination button,
        .sidebar-btn {
            position: relative;
            overflow: hidden;
        }

        .pagination button:active,
        .sidebar-btn:active {
            animation: btnClick 0.3s ease;
        }

        @keyframes btnClick {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .sidebar {
                top: auto;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                padding: 10px;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 30px;
            }

            .sidebar-btn {
                padding: 10px 20px;
                font-size: 14px;
                border-radius: 20px;
            }

            .sidebar-btn:hover {
                transform: translateX(5px) translateY(-2px);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>

<body>
<!-- 侧边栏按钮 -->
<div class="sidebar">
    <a href="/music/api/mine/myrank" class="sidebar-btn">返回主页</a>
    <a href="/music/api/mine/myrank" class="sidebar-btn">返回首页</a>
    <a href="/music/login.html" class="sidebar-btn">返回登录</a>
</div>

<div class="container">
    <div class="header">
        <h1>我的收藏</h1>
        <p>查看您收藏的歌单</p>
    </div>


    <div class="rankings-container">
        <div th:each="ranking, stat : ${myloveSongs.list}" class="ranking-item">
            <div class="ranking-content">
                <!-- 榜单基本信息 -->
                <h3 th:text="${ranking.rankName}">榜单标题</h3>
                <p th:text="|更新于: ${ranking.publishTime}|">最后更新时间</p>


                <!-- 榜单下的歌曲列表 -->
                <div class="song-list">
                    <h4>歌曲列表</h4>
                    <ul>
                        <li th:each="song : ${ranking.rankSongList}">
                            <span class="song-name" th:text="${song.songName}">歌曲名称</span>
                            <span class="song-rank" th:text="${song.ranking}">排名</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 总的分页控件 -->
        <div class="pagination" th:if="${myloveSongs != null}">
            <button th:disabled="${myloveSongs.pageNum == 1}"
                    th:onclick="|goToPage(${myloveSongs.pageNum - 1})|">上一页</button>

            <button th:each="i : ${#numbers.sequence(1, myloveSongs.pages)}"
                    th:class="${myloveSongs.pageNum == i ? 'active' : ''}" th:onclick="|goToPage(${i})|"
                    th:text="${i}">1</button>

            <button th:disabled="${myloveSongs.pageNum == myloveSongs.pages}"
                    th:onclick="|goToPage(${myloveSongs.pageNum + 1})|">下一页</button>
        </div>

        <div class="empty-state"
             th:if="${myloveSongs == null or myloveSongs.list == null or myloveSongs.list.isEmpty()}">
            <h3>暂无收藏</h3>
            <p>您还没有收藏任何歌单</p>
        </div>
    </div>
</div>

<script>
    // 初始化代码，从 URL 中获取参数并存储到 localStorage
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        const urlUid = urlParams.get('userId') || urlParams.get('user_id');

        // 强制把 URL 里的参数更新到 localStorage
        if (urlToken) localStorage.setItem('token', urlToken);
        if (urlUid) localStorage.setItem('user_id', urlUid);

        console.log('✅ 收藏页面初始化完成，参数已同步到 localStorage：', {
            token: localStorage.getItem('token'),
            user_id: localStorage.getItem('user_id')
        });
    })();
    function goToPage(page) {
        const currentToken = localStorage.getItem('token') || getUrlParam('token');
        const currentUserId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
        window.location.href = `/music/api/mine/mylove?pageNum=${page}&token=${encodeURIComponent(currentToken)}&userId=${encodeURIComponent(currentUserId)}`;
    }

    // 获取 URL 参数的函数
    function getUrlParam(paramName) {
        const searchParams = new URLSearchParams(window.location.search);
        return searchParams.get(paramName);
    }

    // 禁用状态的分页按钮点击事件
    document.addEventListener('DOMContentLoaded', function () {
        const pageBtns = document.querySelectorAll('.pagination button');
        pageBtns.forEach(btn => {
            if (btn.hasAttribute('disabled')) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                });
            }
        });
    });
</script>
</body>

</html>
