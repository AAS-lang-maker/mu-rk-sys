<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/axios.min.js}"></script>
    <script th:src="@{/js/request.js}"></script>
    <title>个人榜单</title>
    <link rel="icon" href="data:'base:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" th:href="@{/player/music-player.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: #1a202c;
            padding: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                #1a365d;
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-attachment: fixed;
            position: relative;
        }

        .page-wrapper {
            display: flex;
            min-height: 100vh;
            gap: 20px;
            padding: 20px;
            padding-bottom: 120px;
        }

        .left-sidebar {
            width: 100px;
            background: #fff9c4;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .nav-toggle-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid #1a365d;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .nav-toggle-btn:hover {
            background: #1a365d;
        }

        .nav-toggle-btn:hover svg rect {
            fill: #fff9c4;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .nav-circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff9c4;
            border: 2px solid #1a365d;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .nav-circle-btn:hover {
            background: #1a365d;
            transform: scale(1.05);
        }

        .nav-circle-btn.active {
            background: #1a365d;
        }

        .nav-icon {
            font-size: 18px;
        }

        .nav-text {
            font-size: 10px;
            color: #1a365d;
            font-weight: bold;
        }

        .nav-circle-btn:hover .nav-text,
        .nav-circle-btn.active .nav-text {
            color: #fff9c4;
        }

        /* 发布按钮的特殊样式 */
        .nav-add-btn {
            background: linear-gradient(135deg, #fffa9c, #fff176);
            border-color: #f57f17;
        }

        .nav-add-btn:hover {
            background: linear-gradient(135deg, #fff176, #ffee58);
            transform: scale(1.1) rotate(90deg);
        }

        /* 导航栏底部虚线分隔 */
        .sidebar-divider {
            margin-top: 5px;
            border-top: 2px dashed #1a365d;
        }

        .left-sidebar.collapsed {
            width: 60px !important;
        }

        .left-sidebar.collapsed .nav-text {
            display: none;
        }

        .left-sidebar.collapsed .nav-circle-btn {
            width: 45px;
            height: 45px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 15px;
            overflow-y: auto;
            height: calc(100vh - 40px);
            flex: 1;
            max-width: calc(100% - 120px);
        }

        .ranking-list-box {
            background: linear-gradient(135deg, #fffa9c 0%, #fff9c4 100%);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(26, 54, 93, 0.15);
            flex-shrink: 0;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(26, 54, 93, 0.15);
        }

        .user-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 3px solid #1a365d;
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(26, 54, 93, 0.35);
        }

        .user-details h2 {
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 5px;
        }

        .user-details p {
            font-size: 14px;
            color: rgba(26, 54, 93, 0.7);
        }

        .rankings-container {
            background: transparent;
            border-radius: 0;
            padding: 0;
            margin-bottom: 0;
            box-shadow: none;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            pointer-events: auto;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            border: 1px solid rgba(26, 54, 93, 0.1);
        }

        .ranking-content {
            flex: 1;
        }

        .edit-btn {
            background-color: #1a365d;
            color: #fffa9c;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 15px;
            align-self: flex-start;
            pointer-events: auto;
        }

        .edit-btn:hover {
            background-color: #2d3748;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.3);
        }

        .ranking-item:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateX(5px);
            border-left-color: #1a365d;
            box-shadow: 0 4px 15px rgba(26, 54, 93, 0.12);
        }

        .ranking-item h3 {
            color: #1a365d;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .ranking-item p {
            color: rgba(26, 54, 93, 0.7);
            font-size: 14px;
            line-height: 1.5;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            pointer-events: auto;
        }

        .pagination button {
            background: #ffffff;
            border: 1px solid rgba(26, 54, 93, 0.3);
            color: #1a365d;
            border-radius: 8px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #1a365d;
            color: #fffa9c;
            transform: translateY(-2px);
        }

        .pagination button.active {
            background-color: #1a365d;
            color: #fffa9c;
            font-weight: bold;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 1024px) {
            .left-sidebar {
                width: 70px;
            }

            .main-content {
                gap: 15px;
                padding: 20px 15px;
                height: calc(100vh - 30px);
                max-width: calc(100% - 90px);
            }

            .ranking-list-box {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .page-wrapper {
                flex-direction: column;
            }

            .left-sidebar {
                display: none;
            }

            .main-content {
                gap: 12px;
                padding: 15px;
                height: auto;
                min-height: calc(100vh - 30px);
                max-width: 100%;
            }

            .ranking-list-box {
                padding: 15px;
                border-radius: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                margin-bottom: 15px;
            }

            .avatar {
                width: 55px;
                height: 55px;
            }
        }

        .song-list {
            margin-top: 15px;
            padding-left: 0;
            pointer-events: auto;
        }

        .song-list h4 {
            color: #1a365d;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .song-list ul {
            list-style: none;
            padding: 0;
            background: rgba(26, 54, 93, 0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .song-list li {
            margin: 8px 0;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(26, 54, 93, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .song-list li:last-child {
            border-bottom: none;
        }

        .song-list li:hover {
            background: rgba(26, 54, 93, 0.06);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .song-name {
            color: #1a365d;
            font-size: 15px;
        }

        .singer-name {
            color: rgba(26, 54, 93, 0.65);
            font-size: 14px;
        }

        .song-rank {
            color: #1a365d;
            font-size: 15px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(26, 54, 93, 0.1);
            border-radius: 6px;
            margin-right: 10px;
        }

        .play-btn {
            background: rgba(26, 54, 93, 0.1);
            border: 1px solid #1a365d;
            color: #1a365d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            padding-left: 2px;
            pointer-events: auto;
            z-index: 2;
        }

        .play-btn:hover {
            background: #1a365d;
            color: #fffa9c;
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(26, 54, 93, 0.4);
        }

        .song-actions {
            display: flex;
            align-items: center;
        }

        #errorAlert {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff4444;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        #successAlert {
            display: none;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #00C851;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        #music-player-container {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            width: 350px !important;
            min-height: 90px !important;
            z-index: 1001;
        }

        .comment-section {
            margin-top: 20px;
            border-top: 1px solid rgba(26, 54, 93, 0.15);
            padding-top: 15px;
            pointer-events: auto;
        }

        .comment-toggle {
            background: rgba(26, 54, 93, 0.1);
            border: 1px solid rgba(26, 54, 93, 0.3);
            color: #1a365d;
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            margin-bottom: 15px;
            pointer-events: auto;
        }

        .comment-toggle:hover {
            background: rgba(26, 54, 93, 0.2);
            transform: translateY(-2px);
        }

        .comment-container {
            display: none;
            animation: fadeIn 0.3s ease;
            pointer-events: auto;
        }

        .comment-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-input-area {
            margin-bottom: 20px;
        }

        .comment-input {
            width: 100%;
            padding: 12px;
            background: rgba(26, 54, 93, 0.04);
            border: 1px solid rgba(26, 54, 93, 0.25);
            border-radius: 10px;
            color: #1a365d;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .comment-input:focus {
            outline: none;
            border-color: #1a365d;
            box-shadow: 0 0 10px rgba(26, 54, 93, 0.2);
        }

        .comment-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .comment-submit {
            background: #1a365d;
            color: #fffa9c;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
            pointer-events: auto;
        }

        .comment-submit:hover {
            background: #2d3748;
            transform: translateY(-2px);
        }

        .comment-list {
            margin-top: 20px;
        }

        .comment-item {
            background: rgba(26, 54, 93, 0.04);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(26, 54, 93, 0.08);
        }

        .comment-item:hover {
            background: rgba(26, 54, 93, 0.07);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-username {
            color: #1a365d;
            font-weight: bold;
            font-size: 14px;
        }

        .comment-time {
            color: rgba(26, 54, 93, 0.5);
            font-size: 12px;
        }

        .comment-content {
            color: #2d3748;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .comment-actions-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .comment-delete-btn {
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255, 99, 71, 0.7);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .comment-delete-btn:hover {
            color: #ff6347;
            background-color: rgba(255, 99, 71, 0.1);
            transform: translateY(-1px);
        }

        .comment-delete-btn:active {
            transform: translateY(0);
            opacity: 0.8;
        }

        .comment-delete-btn::before {
            content: "🗑️";
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(26, 54, 93, 0.5);
            font-size: 16px;
        }

        .delete-btn {
            background: #f68d8d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
            align-self: flex-start;
            pointer-events: auto;
        }

        .delete-btn:hover {
            background-color: #ef6c6c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(246, 141, 141, 0.5);
        }
    </style>
    <script th:src="@{/player/music-player.js}"></script>
</head>

<body>
    <div id="errorAlert"></div>
    <div id="successAlert"></div>

    <div class="page-wrapper">
        <!-- ========== 左侧导航栏 ========== -->
        <div class="left-sidebar">
            <div class="nav-toggle-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="7" height="7" rx="1" fill="#1a365d" />
                    <rect x="14" y="3" width="7" height="7" rx="1" fill="#1a365d" />
                    <rect x="3" y="14" width="7" height="7" rx="1" fill="#1a365d" />
                    <rect x="14" y="14" width="7" height="7" rx="1" fill="#1a365d" />
                </svg>
            </div>

            <nav class="nav-buttons">
                <button class="nav-circle-btn" id="navIndex" title="首页">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </button>
                <button class="nav-circle-btn" id="navHome" title="主页">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">主页</span>
                </button>
                <button class="nav-circle-btn" id="navSearch" title="搜索">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-text">搜索</span>
                </button>
                <button class="nav-circle-btn active" id="navMyRank" title="榜单">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">榜单</span>
                </button>
                <button class="nav-circle-btn" id="navHotRank" title="热门">
                    <span class="nav-icon">🔥</span>
                    <span class="nav-text">热门</span>
                </button>
                <button class="nav-circle-btn" id="navMyLove" title="收藏">
                    <span class="nav-icon">❤️</span>
                    <span class="nav-text">收藏</span>
                </button>
                <button class="nav-circle-btn" id="btn-reLogin" title="登录">
                    <span class="nav-icon">🔑</span>
                    <span class="nav-text">登录</span>
                </button>
                <button class="nav-circle-btn nav-add-btn" id="navAdd" title="发布">
                    <span class="nav-icon">➕</span>
                    <span class="nav-text">发布</span>
                </button>
            </nav>

            <div class="sidebar-divider"></div>
        </div>

        <!-- ========== 中间主内容区 ========== -->
        <div class="main-content">
            <div class="ranking-list-box">
                <div class="header">
                    <div class="user-info">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=user%20avatar%20profile%20picture%20friendly%20face&image_size=square"
                            alt="用户头像" class="avatar">
                        <div class="user-details">
                            <h2 th:text="${username}">用户名</h2>
                            <p th:text="${userName}">用户昵称</p>
                            <p>个人榜单管理</p>
                        </div>
                    </div>
                </div>

                <div class="rankings-container">
                    <div th:each="ranking, stat : ${personalRanks?.list}" class="ranking-item"
                        th:data-rank-id="${ranking.rankId}">
                        <div class="ranking-content">
                            <h3 th:text="${ranking.rankName}">榜单标题</h3>
                            <p th:text="|更新于: ${ranking.publishTime}|">最后更新时间</p>

                            <div class="song-list">
                                <h4>歌曲列表</h4>
                                <ul>
                                    <li th:each="song : ${ranking.rankSongList}" th:data-song-id="${song.songId}">
                                        <div class="song-info">
                                            <span class="song-name" th:text="${song?.songName}">歌曲名称</span>
                                            <span class="singer-name" th:text="${song.singerName}">歌手名称</span>
                                        </div>
                                        <div class="song-actions">
                                            <span class="song-rank" th:text="${song?.ranking}">排名</span>
                                            <button class="play-btn" th:data-song-id="${song.songId}"
                                                th:data-song-name="${song.songName}"
                                                th:data-singer-name="${song.singerName}">
                                                &#9658;
                                            </button>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="comment-section">
                                <button class="comment-toggle" th:data-rank-id="${ranking.rankId}">
                                    查看评论
                                </button>
                                <div class="comment-container" th:id="|comment-container-${ranking.rankId}|">
                                    <div class="comment-input-area">
                                        <textarea class="comment-input" th:id="|comment-input-${ranking.rankId}|"
                                            placeholder="写下你的评论..."></textarea>
                                        <div class="comment-actions">
                                            <button class="comment-submit" th:data-rank-id="${ranking.rankId}">
                                                发表评论
                                            </button>
                                        </div>
                                    </div>
                                    <div class="comment-list" th:id="|comment-list-${ranking.rankId}|">
                                    </div>
                                </div>
                            </div>

                            <button class="edit-btn" th:data-rank-id="${ranking.rankId}">编辑</button>
                            <button class="delete-btn" th:data-rank-id="${ranking.rankId}">
                                删除
                            </button>
                        </div>
                    </div>

                    <div class="pagination" th:if="${personalRanks !=null}">
                        <button th:disabled="${personalRanks.pageNum == 1}"
                            th:data-page="${personalRanks.pageNum - 1}">上一页</button>

                        <button th:each="i : ${#numbers.sequence(1, personalRanks?.pages)}"
                            th:class="${personalRanks.pageNum == i ? 'active' : ''}" th:data-page="${i}"
                            th:text="${i}">1</button>

                        <button th:disabled="${personalRanks.pageNum == personalRanks.pages}"
                            th:data-page="${personalRanks.pageNum + 1}">下一页</button>
                    </div>
                    <div th:if="${#lists.isEmpty(publishRanks?.list)}" class="empty-state">
                        暂无榜单数据
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 音乐播放器（固定定位在右下角） -->
    <div id="music-player-container"></div>


    <script>
        // ===================== 全局核心配置（复用主页）=====================
        function getUrlParam(paramName) {
            const reg = new RegExp("(^|&)" + paramName + "=([^&]*)(&|$)");
            const paramMatch = window.location.search.substr(1).match(reg);
            return paramMatch ? decodeURIComponent(paramMatch[2]) : null;
        }

        function getUserIdFromToken(token) {
            if (!token) return null;
            try {
                const payload = token.split('.')[1];
                const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
                const payloadObj = JSON.parse(decodedPayload);
                return payloadObj.userId || payloadObj.uid || null;
            } catch (error) {
                console.error("解析Token失败:", error);
                return null;
            }
        }

        let token = getUrlParam("token") || localStorage.getItem('token') || '';
        let userId = getUrlParam("userId") || getUrlParam("user_id") || getUserIdFromToken(token) || localStorage.getItem('user_id') || '';
        let category = parseInt(getUrlParam("category")) || 1;
        let musicPlayer = null;

        function showErrorTip(msg) {
            let el = document.getElementById('errorAlert');
            if (!el) {
                el = document.createElement('div');
                el.id = 'errorAlert';
                el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#ff4444;color:#fff;border-radius:4px;z-index:9999;';
                document.body.appendChild(el);
            }
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function showSuccessTip(msg) {
            let el = document.getElementById('successAlert');
            if (!el) {
                el = document.createElement('div');
                el.id = 'successAlert';
                el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#00C851;color:#fff;border-radius:4px;z-index:9999;';
                document.body.appendChild(el);
            }
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function padStartCompat(str, length, padChar) {
            str = str.toString();
            while (str.length < length) {
                str = padChar + str;
            }
            return str;
        }

        // ===================== 播放器核心逻辑（完全复用主页）=====================
        function initMusicPlayer() {
            if (musicPlayer) return;
            try {
                musicPlayer = new MusicPlayer({
                    container: 'music-player-container',
                    token: token,
                    userId: userId
                });
                console.log("播放器初始化成功");
            } catch (e) {
                console.error("播放器初始化失败:", e);
                showErrorTip("播放器加载失败：" + e.message);
            }
        }

        function playSong(song) {
            if (!song) {
                showErrorTip("歌曲信息为空！");
                return;
            }
            if (!musicPlayer) {
                initMusicPlayer();
            }
            try {
                musicPlayer.playSong(song);
                showSuccessTip(`开始播放：${song.songName}`);
            } catch (e) {
                console.error("播放歌曲失败:", e);
                showErrorTip("播放失败：" + e.message);
            }
        }

        function playSongFromData(btn) {
            const songId = btn.dataset.songId;
            const songName = btn.dataset.songName;
            const singerName = btn.dataset.singerName;

            if (!songId) {
                showErrorTip("歌曲ID为空，无法播放！");
                return;
            }

            playSong({
                songId: songId,
                songName: songName || "未知歌曲",
                singerName: singerName || "未知歌手"
            });
        }

        // ===================== 评论区功能（新增，和主页一致，不含评论点赞）=====================
        function toggleComments(rankId) {
            const container = document.getElementById(`comment-container-${rankId}`);
            if (!container) {
                showErrorTip("评论容器未找到！");
                return;
            }
            const toggleBtn = container.previousElementSibling;

            if (container.classList.contains('show')) {
                container.classList.remove('show');
                toggleBtn.textContent = '查看评论';
            } else {
                container.classList.add('show');
                toggleBtn.textContent = '收起评论';
                loadComments(rankId);
            }
        }

        function loadComments(rankId) {
            console.log('加载评论列表，rankId:', rankId);
            const commentList = document.getElementById(`comment-list-${rankId}`);
            if (!commentList) return;

            if (!token) {
                commentList.innerHTML = '<p style="color: rgba(26, 54, 93, 0.6); text-align: center;">请先登录后查看评论</p>';
                return;
            }

            commentList.innerHTML = '<p style="color: rgba(26, 54, 93, 0.6); text-align: center;">加载中...</p>';

            axios.get(`/music/api/rank/list`, {
                params: {
                    token: token,
                    rankId: rankId,
                    userId: userId
                }
            })
                .then(response => {
                    console.log('加载评论响应:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        const comments = response.data.data || response.data;
                        renderComments(commentList, comments);
                    } else {
                        commentList.innerHTML = `<p style="color: rgba(26, 54, 93, 0.6); text-align: center;">查询评论失败：${response.data.msg || '未知错误'}</p>`;
                        console.error('评论查询失败:', response.data);
                    }
                })
                .catch(error => {
                    console.error('加载评论失败:', error);
                    commentList.innerHTML = `<p style="color: rgba(26, 54, 93, 0.6); text-align: center;">加载评论失败：${error.response?.data?.msg || error.message}</p>`;
                });
        }

        function renderComments(container, comments) {
            if (!comments || comments.length === 0) {
                container.innerHTML = '<p style="color: rgba(26, 54, 93, 0.6); text-align: center;">暂无评论</p>';
                return;
            }

            container.innerHTML = '';
            comments.forEach(comment => {
                const commentItem = document.createElement('div');
                commentItem.className = 'comment-item';

                commentItem.innerHTML = `
                <div class="comment-header">
                    <span class="comment-username">${comment.username || '匿名用户'}</span>
                    <span class="comment-time">${formatTime(comment.comTime)}</span>
                </div>
                <div class="comment-content">${comment.comContent || ''}</div>
                <div class="comment-actions-bar">
                    ${comment.userId === parseInt(userId) ?
                        `<button class="comment-delete-btn" data-comment-id="${comment.comId}">删除</button>` : ''
                    }
                </div>
            `;

                container.appendChild(commentItem);
            });
        }

        function submitComment(rankId) {
            console.log('提交评论,rankId:', rankId);
            const input = document.getElementById(`comment-input-${rankId}`);
            if (!input) {
                showErrorTip("评论输入框未找到！");
                return;
            }
            const content = input.value.trim();

            if (!content) {
                showErrorTip("评论内容不能为空！");
                return;
            }

            if (!token || !userId || isNaN(userId)) {
                showErrorTip("请先登录后再评论！");
                return;
            }

            axios.post(`/music/api/rank/pubcomment`, {
                rankId: rankId,
                userId: userId,
                content: content,
                parentId: null
            }, {
                params: { token: token }
            })
                .then(response => {
                    console.log('提交评论成功:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        showSuccessTip("评论发表成功！");
                        input.value = '';
                        loadComments(rankId);
                    } else {
                        showErrorTip("评论发表失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('提交评论失败:', error);
                    showErrorTip("评论发表失败：" + (error.response?.data?.msg || error.message));
                });
        }

        function deleteComment(commentId) {
            console.log('删除评论，commentId:', commentId);

            if (!confirm('确定要删除这条评论吗？')) {
                return;
            }

            axios.delete(`/music/api/rank/deleteComment`, {
                params: {
                    token: token,
                    comId: commentId,
                    userId: userId
                }
            })
                .then(response => {
                    console.log('删除评论成功:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        showSuccessTip("删除评论成功！");
                        const commentItem = document.querySelector(`[data-comment-id="${commentId}"]`).closest('.comment-item');
                        const commentContainer = commentItem.closest('[id^="comment-container-"]');
                        const rankId = commentContainer.id.replace('comment-container-', '');
                        loadComments(rankId);
                    } else {
                        showErrorTip("删除评论失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('删除评论失败:', error);
                    showErrorTip("删除评论失败：" + (error.response?.data?.msg || error.message));
                });
        }

        function formatTime(time) {
            if (!time) return '';
            const date = new Date(time);
            if (isNaN(date.getTime())) return '未知时间';
            const year = date.getFullYear();
            const month = padStartCompat(date.getMonth() + 1, 2, '0');
            const day = padStartCompat(date.getDate(), 2, '0');
            const hour = padStartCompat(date.getHours(), 2, '0');
            const minute = padStartCompat(date.getMinutes(), 2, '0');
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        // ===================== 原有业务逻辑（保留不变）=====================
        (function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('token') || '';
                const urlUid = urlParams.get('user_id') || urlParams.get('userId') || '';
                const urlUserName = urlParams.get('userName') || urlParams.get('username') || '';
                const urlCategory = urlParams.get('category') || '';
                const urlSuccess = urlParams.get('success') || '';

                localStorage.setItem('token', urlToken);
                localStorage.setItem('user_id', urlUid);
                localStorage.setItem('userName', urlUserName);
                localStorage.setItem('category', urlCategory);
                localStorage.setItem('success', urlSuccess);

                console.log('✅ 初始化完成，参数：', {
                    token: urlToken,
                    userId: urlUid,
                    category: urlCategory,
                    success: urlSuccess
                });
            } catch (err) {
                console.error('❌ 初始化出错：', err);
            }
        })();

        function goToHome() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let token = urlParams.get('token') || localStorage.getItem('token') || '';
                let user_id = urlParams.get('userId') || urlParams.get('user_id') || localStorage.getItem('user_id') || '';
                let userName = urlParams.get('userName') || localStorage.getItem('userName') || '';
                const category = urlParams.get('category') || localStorage.getItem('category') || '';
                const success = urlParams.get('success') || localStorage.getItem('success') || '';

                console.log('📌 跳转主页前读取的参数：', { token, user_id, userName, category, success });

                if (!token) {
                    alert('登录信息已失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                if (!user_id) {
                    alert('用户ID缺失，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                const params = new URLSearchParams();
                params.append('token', token);
                params.append('userId', user_id);
                if (userName) params.append('userName', userName);
                if (category) params.append('category', category);
                if (success) params.append('success', success);

                const targetUrl = `/music/api/rank/publish?${params.toString()}`;
                console.log('📌 最终跳转主页URL：', targetUrl);

                window.location.href = targetUrl;

            } catch (err) {
                console.error('❌ 跳转主页出错：', err);
                alert('跳转失败，请刷新页面重试！');
            }
        }

        function goToIndex() {
            try {
                const token = localStorage.getItem('token') || getUrlParam('token');
                const userId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
                const userName = localStorage.getItem('userName') || '';
                
                let url = '/music/index.html';
                const params = new URLSearchParams();
                if (token) params.append('token', token);
                if (userId) params.append('userId', userId);
                if (userName) params.append('userName', userName);
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                window.location.href = url;
            } catch (err) {
                console.error('❌ 跳转首页出错：', err);
                alert('跳转失败，请刷新页面重试！');
            }
        }

        function goToSearch() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token') || localStorage.getItem('token') || '';
                const userId = urlParams.get('userId') || urlParams.get('user_id') || localStorage.getItem('user_id') || '';
                const category = urlParams.get('category') || localStorage.getItem('category') || '1';

                console.log('📌 跳转搜索页前读取的参数：', { token, userId, category });

                if (!token) {
                    alert('登录信息失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                if (!userId) {
                    alert('用户ID缺失，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                const params = new URLSearchParams();
                params.append('token', token);
                params.append('userId', userId);
                params.append('category', category);

                const targetUrl = `/music/api/rank/search?${params.toString()}`;
                console.log('📌 最终跳转搜索页URL：', targetUrl);

                window.location.href = targetUrl;
            } catch (err) {
                console.error('❌ 跳转搜索页出错：', err);
                alert('跳转失败，请刷新重试！');
            }
        }

        function goToHotRank() {
            try {
                const token = localStorage.getItem('token') || getUrlParam('token');
                const userId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
                
                if (!token || !userId) {
                    alert('登录信息失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }
                
                let url = `/music/hotrank.html?token=${encodeURIComponent(token)}&userId=${encodeURIComponent(userId)}`;
                window.location.href = url;
            } catch (err) {
                console.error('❌ 跳转热门榜出错：', err);
                alert('跳转失败，请刷新重试！');
            }
        }

        function goToPu() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token') || localStorage.getItem('token') || '';
                const userId = urlParams.get('userId') || urlParams.get('user_id') || localStorage.getItem('user_id') || '';
                const category = urlParams.get('category') || localStorage.getItem('category') || '';
                const success = urlParams.get('success') || localStorage.getItem('success') || '';

                console.log('📌 跳转前参数：', { token, userId, category, success });

                if (!token || !userId) {
                    alert('登录信息失效，请重新登录');
                    window.location.href = '/music/login.html';
                    return;
                }

                const params = new URLSearchParams();
                params.append('token', token);
                params.append('userId', userId);
                if (category) params.append('category', category);
                if (success) params.append('success', success);

                const targetUrl = `/music/api/rank/publish?${params.toString()}`;
                console.log('📌 最终跳转URL：', targetUrl);

                window.location.href = targetUrl;

            } catch (err) {
                console.error('❌ 跳转出错：', err);
                alert('跳转失败，请刷新重试！');
            }
        }

        function editRanking(id) {
            const token = localStorage.getItem('token');
            const targetUrl = `/music/api/mine/edit/${id}?token=${encodeURIComponent(token)}`;
            window.location.href = targetUrl;
        }

        function goToMyLove() {
            const token = localStorage.getItem('token') || getUrlParam('token');
            const userId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');

            if (token) {
                let url = `/music/api/mine/lv?token=${encodeURIComponent(token)}`;
                if (userId) {
                    url += `&userId=${encodeURIComponent(userId)}`;
                }
                url += '&pageNum=1&pageSize=10';
                window.location.href = url;
            } else {
                showErrorTip('登录信息失效，请重新登录！');
                window.location.href = '/music/login.html';
            }
        }

        function deleteRanking(rankId) {
            if (!confirm('确定要删除这个榜单吗？删除后无法恢复！')) {
                return;
            }

            const token = localStorage.getItem('token') || getUrlParam('token');
            if (!token) {
                showErrorTip('登录信息失效，请重新登录');
                window.location.href = '/music/login.html';
                return;
            }

            const deleteUrl = `/music/api/mine/deleterank?token=${encodeURIComponent(token)}&rankId=${rankId}`;

            fetch(deleteUrl, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('删除请求失败');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.code === 200 || data.success) {
                        showSuccessTip('榜单删除成功！');
                        location.reload();
                    } else {
                        showErrorTip(data.msg || '删除失败，请重试');
                    }
                })
                .catch(error => {
                    console.error('删除请求异常：', error);
                    showErrorTip('网络错误，请稍后重试');
                });
        }

        function goToPage(page) {
            const currentToken = localStorage.getItem('token') || getUrlParam('token');
            const currentUserId = localStorage.getItem('user_id') || getUrlParam('user_id') || getUrlParam('userId');
            window.location.href = `/music/api/mine/myrank?pageNum=${page}&token=${encodeURIComponent(currentToken)}&userId=${encodeURIComponent(currentUserId)}`;
        }

        // ===================== 事件委托绑定（核心修复）=====================
        document.addEventListener('DOMContentLoaded', function () {
            initMusicPlayer();

            document.addEventListener('click', function (e) {
                const target = e.target;

                if (target.closest('#btn-goToPu')) {
                    goToPu();
                    return;
                }
                if (target.closest('#btn-reLogin')) {
                    window.location.href = '/music/login.html';
                    return;
                }
                // ========== 导航按钮事件绑定 ==========
                if (target.closest('#navIndex')) {
                    goToIndex();
                    return;
                }
                if (target.closest('#navHome')) {
                    goToHome();
                    return;
                }
                if (target.closest('#navSearch')) {
                    goToSearch();
                    return;
                }
                if (target.closest('#navMyRank')) {
                    location.reload();
                    return;
                }
                if (target.closest('#navHotRank')) {
                    goToHotRank();
                    return;
                }
                if (target.closest('#navMyLove')) {
                    goToMyLove();
                    return;
                }
                if (target.closest('#navAdd')) {
                    goToPu();
                    return;
                }
                if (target.closest('#btn-reLogin')) {
                    window.location.href = '/music/login.html';
                    return;
                }

                const playBtn = e.target.closest('.play-btn');
                if (playBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    playSongFromData(playBtn);
                    return;
                }

                const editBtn = e.target.closest('.edit-btn');
                if (editBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = editBtn.dataset.rankId;
                    editRanking(rankId);
                    return;
                }

                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = deleteBtn.dataset.rankId;
                    deleteRanking(rankId);
                    return;
                }

                const commentToggle = e.target.closest('.comment-toggle');
                if (commentToggle) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = commentToggle.dataset.rankId;
                    toggleComments(rankId);
                    return;
                }

                const commentSubmit = e.target.closest('.comment-submit');
                if (commentSubmit) {
                    e.preventDefault();
                    e.stopPropagation();
                    const rankId = commentSubmit.dataset.rankId;
                    submitComment(rankId);
                    return;
                }

                const commentDelete = e.target.closest('.comment-delete-btn');
                if (commentDelete) {
                    e.preventDefault();
                    e.stopPropagation();
                    const commentId = commentDelete.dataset.commentId;
                    deleteComment(commentId);
                    return;
                }

                const pageBtn = e.target.closest('.pagination button');
                if (pageBtn && !pageBtn.disabled) {
                    e.preventDefault();
                    e.stopPropagation();
                    const page = pageBtn.dataset.page;
                    goToPage(page);
                    return;
                }

                if (target.closest('.nav-toggle-btn')) {
                    const sidebar = document.querySelector('.left-sidebar');
                    sidebar.classList.toggle('collapsed');
                    return;
                }
            });

            if (!token || !userId || isNaN(userId)) {
                showErrorTip('登录信息失效，请重新登录');
                setTimeout(() => window.location.href = '/music/login.html', 1500);
            }
        });
    </script>
