<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/axios.min.js}"></script>
    <title>榜单页</title>
    <style>
        /* 保留你原来的所有样式，不修改 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: #f7fafc;
            padding: 20px;
            background:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    #0f172a;
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-attachment: fixed;
            position: relative;
        }

        .container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 36px;
            color: #fffa9c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            font-size: 18px;
            color: rgba(247, 250, 252, 0.7);
        }

        /* 左上角搜索按钮样式 */
        .top-right-search {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 100;
        }

        .search-button {
            width: 70px;
            height: 70px;
            background: #1E293B;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .search-button:hover {
            transform: scale(1.1);
            background: rgba(255, 250, 156, 0.2);
            border-color: #fffa9c;
            box-shadow: 0 0 20px rgba(255, 250, 156, 0.5);
        }

        .search-button img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 100px;
        }

        .content h2 {
            font-size: 24px;
            color: #fffa9c;
            margin-bottom: 30px;
        }

        .content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* 修改加号按钮定位：固定在视口底部中央 */
        .add-button-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .add-button {
            width: 80px;
            height: 80px;
            background-color: #fffa9c;
            color: #1a202c;
            border: none;
            border-radius: 50%;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 250, 205, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 250, 205, 0.6);
        }

        .add-button:active {
            transform: scale(0.95);
        }

        .rankings-list {
            margin-bottom: 30px;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .ranking-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(10px);
            border-left-color: #fffa9c;
        }

        .ranking-item h3 {
            color: #fffa9c;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .ranking-item p {
            color: rgba(247, 250, 252, 0.7);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .ranking-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: rgba(255, 250, 156, 0.8);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 250, 156, 0.3);
            color: #f7fafc;
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #fffa9c;
            color: #1a202c;
            transform: translateY(-2px);
        }

        .pagination button.active {
            background-color: #fffa9c;
            color: #1a202c;
            font-weight: bold;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .song-list {
            margin-top: 15px;
            padding-left: 0;
        }

        .song-list h4 {
            color: #fffa9c;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .song-list ul {
            list-style: none;
            padding: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 10px;
        }

        .song-list li {
            margin: 8px 0;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 250, 156, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .song-list li:last-child {
            border-bottom: none;
        }

        .song-list li:hover {
            background: rgba(255, 250, 156, 0.05);
        }

        .song-name {
            color: #f7fafc;
            font-size: 15px;
            flex: 1;
        }

        .song-rank {
            color: #fffa9c;
            font-size: 15px;
            font-weight: 600;
            margin-left: 20px;
            padding: 4px 10px;
            background: rgba(255, 250, 156, 0.1);
            border-radius: 4px;
        }

        .interaction-section {
            margin-top: 15px;
            padding-left: 15px;
            display: flex;
            gap: 15px;
        }

        .vote-btn,
        .collect-btn {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .vote-btn:hover {
            background: rgba(255, 182, 193, 0.2);
        }

        .collect-btn:hover {
            background: rgba(192, 192, 192, 0.2);
        }

        .heart-icon {
            color: #ffb6c1;
            font-size: 18px;
            margin-right: 5px;
            transition: all 0.3s ease;
        }

        .vote-btn:hover .heart-icon {
            color: #ff69b4;
            transform: scale(1.1);
        }

        .vote-btn.voted .heart-icon {
            color: #ff69b4;
        }

        .star-icon {
            color: #e68181;
            font-size: 18px;
            margin-right: 5px;
            transition: all 0.3s ease;
        }

        .collect-btn:hover .star-icon {
            color: #ffffff;
            transform: scale(1.1);
        }

        .collect-btn.collected .star-icon {
            color: #ffffff;
        }

        .vote-count,
        .collect-count {
            font-size: 14px;
            font-weight: bold;
        }

        .vote-count {
            color: rgba(255, 182, 193, 0.9);
        }

        .collect-count {
            color: rgba(192, 192, 192, 0.9);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 30px;
            }

            .add-button {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }
        }

        /* 新增提示框样式 */
        #errorAlert {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff4444;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        #successAlert {
            display: none;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #00C851;
            color: #fff;
            border-radius: 4px;
            z-index: 9999;
        }

        /* 我的榜单按钮样式 */
        .slide-btn-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
        }

        .slide-btn-toggle {
            width: 120px;
            height: 50px;
            border-radius: 25px 0 0 25px;
            background: #fffa9c;
            color: #1a202c;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: bold;
            box-shadow: -2px 0 10px rgba(255, 250, 156, 0.3);
        }

        .slide-btn-toggle:hover {
            background: #fff780;
            box-shadow: -2px 0 15px rgba(255, 250, 156, 0.5);
        }

        .slide-btn-toggle.collapsed {
            width: 50px;
            background: rgba(255, 250, 156, 0.8);
        }

        .slide-btn-toggle.collapsed .toggle-icon {
            display: none;
        }

        .toggle-icon {
            display: inline;
            font-size: 14px;
            margin-left: 5px;
        }

        .slide-btn-content {
            height: 50px;
            padding: 0 20px;
            background: #fffa9c;
            color: #1a202c;
            border: none;
            cursor: pointer;
            border-radius: 4px 0 0 4px;
            margin-right: -1px;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .slide-btn-content.show {
            transform: translateX(0);
            opacity: 1;
        }

        .slide-btn-content:hover {
            background: #fff780;
        }

        /* 返回登录按钮样式 */
        .login-btn-container {
            position: fixed;
            left: 0;
            top: 70%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
        }

        .login-btn-toggle {
            width: 120px;
            height: 50px;
            border-radius: 0 25px 25px 0;
            background: #fffa9c;
            color: #1a202c;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 2px 0 10px rgba(255, 250, 156, 0.3);
        }

        .login-btn-toggle:hover {
            background: #fff780;
            box-shadow: 2px 0 15px rgba(255, 250, 156, 0.5);
        }

        .login-btn-toggle.collapsed {
            width: 50px;
            height: 50px;
            border-radius: 0 25px 25px 0;
            background: #fffa9c;
            /* 保持淡黄色，与展开状态一致 */
        }

        .login-btn-toggle.collapsed .toggle-icon {
            display: none;
        }

        .login-btn-content {
            height: 50px;
            padding: 0 20px;
            background: #fffa9c;
            color: #1a202c;
            border: none;
            cursor: pointer;
            border-radius: 25px 0 0 25px;
            margin-right: -1px;
            transform: translateX(-100%);
            opacity: 0;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .login-btn-content.show {
            transform: translateX(0);
            opacity: 1;
        }

        .login-btn-content:hover {
            background: #fff780;
        }

        /* 新增：暂无数据样式 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(247, 250, 252, 0.6);
            font-size: 18px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 250, 156, 0.3);
            color: #f7fafc;
            border-radius: 6px;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #fffa9c;
            color: #1a202c;
            transform: translateY(-2px);
        }

        .pagination button.active {
            background-color: #fffa9c;
            color: #1a202c;
            font-weight: bold;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 评论区样式 */
        .comment-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 250, 156, 0.1);
            padding-top: 15px;
        }

        .comment-toggle {
            background: rgba(255, 250, 156, 0.1);
            border: 1px solid rgba(255, 250, 156, 0.3);
            color: #fffa9c;
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .comment-toggle:hover {
            background: rgba(255, 250, 156, 0.2);
            transform: translateY(-2px);
        }

        .comment-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .comment-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-input-area {
            margin-bottom: 20px;
        }

        .comment-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 250, 156, 0.3);
            border-radius: 8px;
            color: #f7fafc;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s ease;
        }

        .comment-input:focus {
            outline: none;
            border-color: #fffa9c;
            box-shadow: 0 0 10px rgba(255, 250, 156, 0.3);
        }

        .comment-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .comment-submit {
            background: #fffa9c;
            color: #1a202c;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
        }

        .comment-submit:hover {
            background: #fff780;
            transform: translateY(-2px);
        }

        .comment-list {
            margin-top: 20px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .comment-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-username {
            color: #fffa9c;
            font-weight: bold;
            font-size: 14px;
        }

        .comment-time {
            color: rgba(247, 250, 252, 0.5);
            font-size: 12px;
        }

        .comment-content {
            color: #f7fafc;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .comment-actions-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .comment-like-btn {
            background: transparent;
            border: none;
            color: rgba(247, 250, 252, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .comment-like-btn:hover {
            color: #ff69b4;
        }

        .comment-like-btn.liked {
            color: #ff69b4;
        }

        .comment-like-btn:hover .comment-heart-icon {
            transform: scale(1.1);
        }

        .comment-heart-icon {
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .comment-like-count {
            font-size: 13px;
        }

        .comment-reply {
            margin-left: 30px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid rgba(255, 250, 156, 0.3);
        }
    </style>
</head>

<body>
<div class="container">
    <!-- 右上角搜索按钮 -->
    <div class="top-right-search">
        <button class="search-button" onclick="openSearch()">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="10" stroke="#fffa9c" stroke-width="3" />
                <line x1="21" y1="21" x2="28" y2="28" stroke="#fffa9c" stroke-width="3" stroke-linecap="round" />
            </svg>
        </button>
    </div>
    <!-- 新增提示框（后端重定向的提示会显示在这里） -->
    <div id="errorAlert" th:text="${errormessage}"></div>
    <div id="successAlert" th:text="${success}"></div>

    <div class="header">
        <h1>音乐排行榜</h1>
        <p>探索热门音乐和艺术家</p>
    </div>

    <div class="content">
        <h2>榜单列表</h2>
        <!-- 动态榜单列表：适配后端传递的PageInfo对象 -->
        <div class="rankings-list">
            <!-- 有数据时显示榜单 -->
            <div th:each="ranking, stat : ${publishRanks.list}" class="ranking-item">
                <h3 th:text="${ranking.rankName}">榜单标题</h3>
                <p class="ranking-meta">
                    <span th:text="'更新时间：' + ${ranking.publishTime}">更新时间</span>
                </p>
                <!-- 歌曲列表 -->
                <div class="song-list">
                    <h4>歌曲列表</h4>
                    <ul>
                        <li th:each="song : ${ranking.rankSongList}">
                            <span class="song-name" th:text="${song.songName}">歌曲名称</span>
                            <span class="song-rank" th:text="${song.ranking}">排名</span>
                        </li>
                    </ul>
                </div>
                <!-- 投票和收藏按钮 -->
                <!-- 投票和收藏按钮 -->
                <div class="interaction-section">
                    <button class="vote-btn" th:onclick="|voteForRanking(${ranking.rankId})|">
                        <span class="heart-icon">♥</span>
                        <span class="vote-count" th:text="${ranking.voteCount}">0</span>
                    </button>
                    <button class="collect-btn" th:onclick="|collectRanking(${ranking.rankId})|">
                        <span class="star-icon">★</span>
                        <span class="collect-count" th:text="${ranking.loveCount}">0</span>
                    </button>
                </div>
                <!-- 评论区 -->
                <div class="comment-section">
                    <button class="comment-toggle" th:onclick="|toggleComments(${ranking.rankId})|">
                        查看评论
                    </button>
                    <div class="comment-container" th:id="|comment-container-${ranking.rankId}|">
                        <!-- 评论输入区 -->
                        <div class="comment-input-area">
                <textarea class="comment-input" th:id="|comment-input-${ranking.rankId}|"
                          placeholder="写下你的评论..."></textarea>
                            <div class="comment-actions">
                                <button class="comment-submit" th:onclick="|submitComment(${ranking.rankId})|">
                                    发表评论
                                </button>
                            </div>
                        </div>
                        <!-- 评论列表 -->
                        <div class="comment-list" th:id="|comment-list-${ranking.rankId}|">
                            <!-- 评论将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="pagination">
                <button th:disabled="${publishRanks.pageNum == 1}"
                        th:onclick="|goToPage(${publishRanks.pageNum - 1})|">上一页</button>

                <button th:each="i : ${#numbers.sequence(1, publishRanks.pages)}"
                        th:class="${publishRanks.pageNum == i ? 'active' : ''}" th:onclick="|goToPage(${i})|"
                        th:text="${i}">1</button>

                <button th:disabled="${publishRanks.pageNum == publishRanks.pages}"
                        th:onclick="|goToPage(${publishRanks.pageNum + 1})|">下一页</button>
            </div>

            <!-- 无数据时显示暂无数据 -->
            <div th:if="${publishRanks.list == null or publishRanks.list.size() == 0}" class="empty-state">
                暂无榜单数据
            </div>
        </div>
    </div>

    <!-- 加号发布榜单按钮 -->
    <div class="add-button-container">
        <button class="add-button" id="addBtn">+</button>
    </div>

    <!-- 我的榜单按钮 -->
    <div class="slide-btn-container">
        <button class="slide-btn-toggle expanded" id="slideBtnToggle">
            <span class="toggle-icon">我的榜单</span>
        </button>
        <button class="slide-btn-content show" id="myRankBtn">进入我的榜单</button>
    </div>

    <!-- 返回登录按钮 -->
    <div class="login-btn-container">
        <button class="login-btn-toggle expanded" id="loginBtnToggle">
            <span class="toggle-icon">登录</span>
        </button>
        <button class="login-btn-content show" id="loginBtn">返回登录页面</button>
    </div>
</div>

<script>
    // 1. 工具函数：获取URL参数
    function getUrlParam(paramName) {
        const reg = new RegExp("(^|&)" + paramName + "=([^&]*)(&|$)");
        const paramMatch = window.location.search.substr(1).match(reg);
        return paramMatch ? decodeURIComponent(paramMatch[2]) : null;
    }

    // 2. 全局变量（只声明一次）
    let token = getUrlParam("token");
    let userId = getUrlParam("userId");
    let category = parseInt(getUrlParam("category")) || 1; // 兜底1
    let pageNum = parseInt(getUrlParam("pageNum")) || 1;
    let pageSize = parseInt(getUrlParam("pageSize")) || 4;

    console.log("解析到的category：", getUrlParam("category"));
    console.log("转成数字后：", category);

    // 3. 动态路径工具
    function getTargetPublishPath(category) {
        return "/music" +
            "/api/mine/my";
    }
    function getTargetVotePath(category) {
        return category === 1 ? "/music/api/rank/vote" : "/music/api/workrank/vote";
    }
    function getTargetLovePath(category) {
        return category === 1 ? "/music/api/rank/love" : "/music/api/workrank/love";
    }

    // 4. 提示框
    function showErrorTip(msg) {
        let el = document.getElementById('errorAlert');
        if (!el) {
            el = document.createElement('div');
            el.id = 'errorAlert';
            el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#ff4444;color:#fff;border-radius:4px;z-index:9999;';
            document.body.appendChild(el);
        }
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    function showSuccessTip(msg) {
        let el = document.getElementById('successAlert');
        if (!el) {
            el = document.createElement('div');
            el.id = 'successAlert';
            el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#00C851;color:#fff;border-radius:4px;z-index:9999;';
            document.body.appendChild(el);
        }
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    // 5. 搜索功能
    function openSearch() {
        // 直接跳转到搜索页面（通过sou接口重定向）
        const searchUrl = `/music/api/rank/sou?token=${encodeURIComponent(token)}&category=${category}`;
        window.location.href = searchUrl;
    }

    // 6. 页面加载完成后，再绑定所有事件（核心！）
    window.onload = function () {
        console.log("DOM加载完成，开始绑定事件");

        // 先获取所有按钮（只在这里获取一次）
        const slideBtnToggle = document.getElementById('slideBtnToggle');
        const myRankBtn = document.getElementById('myRankBtn');
        const loginBtnToggle = document.getElementById('loginBtnToggle');
        const loginBtn = document.getElementById('loginBtn');
        const addBtn = document.getElementById("addBtn");

        // 我的榜单展开/收起
        let isExpanded = true;
        slideBtnToggle.onclick = function () {
            isExpanded = !isExpanded;
            if (isExpanded) {
                slideBtnToggle.classList.remove('collapsed');
                slideBtnToggle.classList.add('expanded');
                myRankBtn.classList.add('show');
            } else {
                slideBtnToggle.classList.remove('expanded');
                slideBtnToggle.classList.add('collapsed');
                myRankBtn.classList.remove('show');
            }
        };

        // 进入我的榜单（核心跳转）
        myRankBtn.onclick = function () {
            console.log("【进入我的榜单】按钮被点击");
            if (!token || !userId || isNaN(userId)) {
                showErrorTip("缺少登录信息，请重新登录！");
                setTimeout(() => window.location.href = "/login.html", 1500);
                return false;
            }
            const targetPath = getTargetPublishPath(category);
            const jumpUrl = `${targetPath}?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}&pageNum=1&pageSize=10`;
            console.log("跳转URL：", jumpUrl);
            window.location.href = jumpUrl;
            return false;
        };

        // 加号发布榜单
        addBtn.onclick = function () {
            console.log("【加号发布】按钮被点击");
            if (!token || !userId || !category || isNaN(userId) || isNaN(category)) {
                showErrorTip("参数缺失，请刷新页面重试！");
                return false;
            }
            let addPagePath = category === 1 ? "/music/rank.html" : "/music/workrank.html";
            const jumpUrl = `${addPagePath}?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}`;
            console.log("发布跳转URL：", jumpUrl);
            window.location.href = jumpUrl;
            return false;
        };

        // 返回登录展开/收起（修复核心逻辑）
        let isLoginExpanded = true;
        loginBtnToggle.onclick = function () {
            isLoginExpanded = !isLoginExpanded;
            if (isLoginExpanded) {
                loginBtnToggle.classList.remove('collapsed');
                loginBtnToggle.classList.add('expanded');
                loginBtn.classList.add('show');
            } else {
                loginBtnToggle.classList.remove('expanded');
                loginBtnToggle.classList.add('collapsed');
                loginBtn.classList.remove('show');
            }
            // 阻止事件冒泡和默认行为，避免触发跳转
            return false;
        };

        // 返回登录页面（仅点击这个按钮才跳转）
        loginBtn.onclick = function () {
            console.log("【返回登录】按钮被点击");
            window.location.href = "/music/login.html";
            return false;
        };

        // 页面加载校验
        if (!token || token.trim() === '' || !userId || isNaN(userId)) {
            showErrorTip("登录信息失效，请重新登录！");
            setTimeout(() => window.location.href = "/music//login.html", 1500);
            return;
        }
        console.log("页面加载成功，参数：", { token, userId, category, pageNum, pageSize });
        showSuccessTip("页面加载成功！");
    };

    // 7. 分页
    function goToPage(page) {
        const targetPath = getTargetPublishPath(category);
        const jumpUrl = `/music/api/rank/publish?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}&pageNum=${page}&pageSize=${pageSize}`;
        window.location.href = jumpUrl;
    }

    // 8. 投票
    function voteForRanking(rankId) {
        console.log('投票按钮点击，rankId:', rankId);
        if (!token) {
            showErrorTip("请先登录后再投票！");
            return;
        }
        // 直接使用完整的绝对路径，确保与分页功能使用相同的格式
        const voteUrl = window.location.origin + '/music/api/rank/vote?token=' + encodeURIComponent(token) + '&rankId=' + rankId + '&category=' + category + '&pageNum=' + pageNum + '&pageSize=' + pageSize;
        console.log('投票请求URL:', voteUrl);
        // 创建临时表单
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = voteUrl;

        // 添加到页面并提交
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
    }

    // 9. 收藏
    function collectRanking(rankId) {
        console.log('收藏按钮点击，rankId:', rankId);
        if (!token || !userId || isNaN(userId)) {
            showErrorTip("请先登录后再收藏！");
            return;
        }
        // 直接使用完整的绝对路径，确保与分页功能使用相同的格式
        const collectUrl = window.location.origin + '/music/api/rank/love?token=' + encodeURIComponent(token) + '&userId=' + userId + '&rankId=' + rankId + '&category=' + category + '&pageNum=' + pageNum + '&pageSize=' + pageSize;
        console.log('收藏请求URL:', collectUrl);
        // 创建临时表单
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = collectUrl;

        // 添加到页面并提交
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
    }
    // 10. 评论功能
    // 切换评论区显示/隐藏
    function toggleComments(rankId) {
        const container = document.getElementById(`comment-container-${rankId}`);
        const toggleBtn = container.previousElementSibling;

        if (container.classList.contains('show')) {
            container.classList.remove('show');
            toggleBtn.textContent = '查看评论';
        } else {
            container.classList.add('show');
            toggleBtn.textContent = '收起评论';
            // 加载评论列表
            loadComments(rankId);
        }
    }

    // 加载评论列表
    function loadComments(rankId) {
        console.log('加载评论列表，rankId:', rankId);
        const commentList = document.getElementById(`comment-list-${rankId}`);

        if (!token) {
            commentList.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">请先登录后查看评论</p>';
            return;
        }

        // 显示加载中
        commentList.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">加载中...</p>';

        // 调用后端API
        axios.get(`/music/api/rank/list`, {
            params: {
                token: token,
                rankId: rankId
            }
        })
            .then(response => {
                console.log('加载评论响应:', response.data); // 新增：打印完整响应
                if (response.data.code === 200 || response.data.success) {
                    const comments = response.data.data || response.data;
                    renderComments(commentList, comments);
                } else {
                    // 区分“真的没数据”和“查询失败”
                    commentList.innerHTML = `<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">查询评论失败：${response.data.msg || '未知错误'}</p>`;
                    // 打印错误日志，方便排查
                    console.error('评论查询失败:', response.data);
                }
            })
            .catch(error => {
                console.error('加载评论失败:', error);
                console.error('加载评论失败详情:', error.response?.data || error.message);
                commentList.innerHTML = `<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">加载评论失败：${error.response?.data?.msg || error.message}</p>`;
            });
    }

    // 渲染评论列表
    function renderComments(container, comments) {
        if (!comments || comments.length === 0) {
            container.innerHTML = '<p style="color: rgba(247, 250, 252, 0.7); text-align: center;">暂无评论</p>';
            return;
        }

        container.innerHTML = '';
        comments.forEach(comment => {
            const commentItem = document.createElement('div');
            commentItem.className = 'comment-item';

            // 统一使用CommentVo的字段名，减少歧义
            commentItem.innerHTML = `
      <div class="comment-header">
        <span class="comment-username">${comment.username || '匿名用户'}</span>
        <span class="comment-time">${formatTime(comment.comTime)}</span>
      </div>
      <div class="comment-content">${comment.comContent || ''}</div>
      <div class="comment-actions-bar">
        <button class="comment-like-btn ${comment.isLiked === 1 ? 'liked' : ''}" onclick="toggleCommentLike(${comment.comId}, event)">
          <span class="comment-heart-icon">♥</span>
          <span class="comment-like-count">${comment.likeCount || 0}</span>
        </button>
        ${comment.userId === parseInt(userId) ?
                `<button class="comment-like-btn" onclick="deleteComment(${comment.comId}, event)" style="color: rgba(255, 99, 71, 0.7);">
    删除
</button>` : ''
            }
      </div>
    `;

            container.appendChild(commentItem);
        });
    }

    // 提交评论
    function submitComment(rankId) {
        console.log('提交评论,rankId:', rankId);
        const input = document.getElementById(`comment-input-${rankId}`);
        const content = input.value.trim();

        if (!content) {
            showErrorTip("评论内容不能为空！");
            return;
        }

        if (!token || !userId || isNaN(userId)) {
            showErrorTip("请先登录后再评论！");
            return;
        }

        // 调用后端API
        axios.post(`/music/api/rank/pubcomment`, {
        }, {
            params: {
                token: token,
                rankId: rankId,
                userId: userId,
                content: content,
                parentId: null // 显式传递顶级评论的parentId为null
            }
        })
            .then(response => {
                console.log('提交评论成功:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    showSuccessTip("评论发表成功！");
                    input.value = '';
                    // 重新加载评论列表
                    loadComments(rankId);
                } else {
                    showErrorTip("评论发表失败：" + (response.data.msg || '未知错误'));
                }
            })
            .catch(error => {
                console.error('提交评论失败:', error);
                console.error('提交评论失败详情:', error.response);
                showErrorTip("评论发表失败：" + (error.response?.data?.msg || error.message));
            });
    }

    // 切换评论点赞状态
    function toggleCommentLike(commentId, e) { // 添加e参数
        console.log('切换评论点赞状态，commentId:', commentId);

        if (!token) {
            showErrorTip("请先登录后再点赞！");
            return;
        }

        const likeBtn = e.target.closest('.comment-like-btn'); // 使用传入的e
        if (likeBtn.classList.contains('liked')) {
            // 取消点赞
            unlikeComment(commentId, likeBtn);
        } else {
            // 点赞
            likeComment(commentId, likeBtn);
        }
    }

    // 点赞评论
    function likeComment(commentId, likeBtn) {
        console.log('点赞评论，commentId:', commentId);

        // 调用后端API
        axios.post(`/music/api/rank/like`, {
        }, {
            params: {
                token: token,
                comId: commentId
            }
        })
            .then(response => {
                console.log('点赞成功:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    likeBtn.classList.add('liked');
                    const likeCount = likeBtn.querySelector('.comment-like-count');
                    likeCount.textContent = parseInt(likeCount.textContent) + 1;
                } else {
                    showErrorTip("点赞失败：" + (response.data.msg || '未知错误'));
                }
            })
            .catch(error => {
                console.error('点赞失败:', error);
                showErrorTip("点赞失败：" + error.message);
            });
    }

    // 取消点赞
    function unlikeComment(commentId, likeBtn) {
        console.log('取消点赞，commentId:', commentId);

        // 调用后端API
        axios.post(`/music/api/rank/deleteLike`, {
        }, {
            params: {
                token: token,
                comId: commentId
            }
        })
            .then(response => {
                console.log('取消点赞完整响应:', response.data); // 打印完整响应，方便排查
                if (response.data.code === 200 || response.data.success) {
                    likeBtn.classList.remove('liked');
                    const likeCount = likeBtn.querySelector('.comment-like-count');
                    likeCount.textContent = Math.max(0, parseInt(likeCount.textContent) - 1);
                } else {
                    showErrorTip("取消点赞失败：" + (response.data.msg || '未知错误')); // 显示后端返回的具体错误信息
                }
            })
            .catch(error => {
                console.error('取消点赞失败:', error);
                console.error('取消点赞失败详情:', error.response?.data || error.message); // 打印错误详情
                showErrorTip("取消点赞失败：" + (error.response?.data?.msg || error.message));
            });
    }

    // 删除评论（完整版，仅保留一个）
    function deleteComment(commentId, e) {
        console.log('删除评论，commentId:', commentId);

        if (!confirm('确定要删除这条评论吗？')) {
            return;
        }

        axios.delete(`/music/api/rank/deleteComment`, {
            params: {
                token: token,
                comId: commentId
            }
        })
            .then(response => {
                console.log('删除评论成功:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    showSuccessTip("删除评论成功！");
                    const rankId = getRankIdFromCommentItem(e.target); // 这里使用传入的 e
                    if (rankId) {
                        loadComments(rankId);
                    }
                } else {
                    showErrorTip("删除评论失败：" + (response.data.msg || '未知错误'));
                }
            })
            .catch(error => {
                console.error('删除评论失败:', error);
                console.error('删除评论失败详情:', error.response?.data || error.message);
                showErrorTip("删除评论失败：" + (error.response?.data?.msg || error.message));
            });
    }

    // 辅助函数：从评论DOM中提取rankId（必须添加）
    function getRankIdFromCommentItem(el) {
        // 1. 向上查找评论容器（comment-container-{rankId}）
        let commentContainer = el.closest('[id^="comment-container-"]');
        if (commentContainer) {
            // 提取rankId（比如从 "comment-container-15" 中提取 15）
            const rankId = commentContainer.id.replace('comment-container-', '');
            console.log('提取到的rankId:', rankId);
            return rankId;
        }

        // 2. 降级方案：从评论列表容器提取
        const commentList = el.closest('[id^="comment-list-"]');
        if (commentList) {
            const rankId = commentList.id.replace('comment-list-', '');
            console.log('从评论列表提取rankId:', rankId);
            return rankId;
        }

        // 3. 最终降级：从URL参数获取（兜底）
        const urlRankId = getUrlParam('rankId');
        console.log('从URL提取rankId:', urlRankId);
        return urlRankId || 0;
    }

    // 格式化时间
    function formatTime(time) {
        if (!time) return '';
        const date = new Date(time);
        // 新增容错：避免时间解析失败
        if (isNaN(date.getTime())) return '未知时间';
        return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    }
</script>
