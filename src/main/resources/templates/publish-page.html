<!-- 先引入播放器JS（核心修复：移到body底部） -->
<script th:src="@{/player/music-player.js}"></script>

<script>
    // ===================== 全局核心配置（统一初始化）=====================
    // 1. 工具函数：获取URL参数
    function getUrlParam(paramName) {
        const reg = new RegExp("(^|&)" + paramName + "=([^&]*)(&|$)");
        const paramMatch = window.location.search.substr(1).match(reg);
        return paramMatch ? decodeURIComponent(paramMatch[2]) : null;
    }

    // 新增：从JWT Token解析userId（解决URL无userId的核心）
    function getUserIdFromToken(token) {
        if (!token) return null;
        try {
            const payload = token.split('.')[1];
            const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            const payloadObj = JSON.parse(decodedPayload);
            return payloadObj.userId || payloadObj.uid || null;
        } catch (error) {
            console.error("解析Token失败:", error);
            return null;
        }
    }

    // 2. 全局变量（补充缺失的 musicPlayer 声明）
    let token = getUrlParam("token");
    let userId = getUrlParam("userId") || getUserIdFromToken(token);
    let category = parseInt(getUrlParam("category")) || 1;
    let pageNum = parseInt(getUrlParam("pageNum")) || 1;
    let pageSize = parseInt(getUrlParam("pageSize")) || 4;
    let musicPlayer = null; // 显式声明播放器变量

    console.log("初始化参数：", { token, userId, category, pageNum, pageSize });

    // 3. 动态路径工具
    function getTargetPublishPath(category) {
        return "/music/api/mine/my";
    }
    function getTargetVotePath(category) {
        return category === 1 ? "/music/api/rank/vote" : "/music/api/workrank/vote";
    }
    function getTargetLovePath(category) {
        return category === 1 ? "/music/api/rank/love" : "/music/api/workrank/love";
    }

    // 4. 提示框工具
    function showErrorTip(msg) {
        let el = document.getElementById('errorAlert');
        if (!el) {
            el = document.createElement('div');
            el.id = 'errorAlert';
            el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#ff4444;color:#fff;border-radius:4px;z-index:9999;';
            document.body.appendChild(el);
        }
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    function showSuccessTip(msg) {
        let el = document.getElementById('successAlert');
        if (!el) {
            el = document.createElement('div');
            el.id = 'successAlert';
            el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#00C851;color:#fff;border-radius:4px;z-index:9999;';
            document.body.appendChild(el);
        }
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    // ===================== 兼容工具函数（修复 padStart 兼容问题）=====================
    function padStartCompat(str, length, padChar) {
        str = str.toString();
        while (str.length < length) {
            str = padChar + str;
        }
        return str;
    }

    // ===================== 播放器核心逻辑（全局可访问）=====================
    // 初始化播放器（全局函数）
    function initMusicPlayer() {
        if (musicPlayer) return; // ✅ 现在变量已声明
        try {
            // 兼容播放器未定义的情况
            if (typeof MusicPlayer === 'undefined') {
                console.warn("MusicPlayer未定义，跳过播放器初始化");
                return;
            }
            musicPlayer = new MusicPlayer({
                container: 'music-player-container',
                token: token,
                userId: userId
            });
            console.log("播放器初始化成功");
        } catch (e) {
            console.error("播放器初始化失败:", e);
            showErrorTip("播放器加载失败：" + e.message);
        }
    }

    // 播放歌曲（全局函数）
    function playSong(song) {
        if (!song) {
            showErrorTip("歌曲信息为空！");
            return;
        }
        if (!musicPlayer) {
            initMusicPlayer();
        }
        try {
            musicPlayer.playSong(song);
            showSuccessTip(`开始播放：${song.songName}`);
        } catch (e) {
            console.error("播放歌曲失败:", e);
            showErrorTip("播放失败：" + e.message);
        }
    }

    // 播放按钮点击处理（全局函数）
    function playSongFromData(btn) {
        const songId = btn.dataset.songId;
        const songName = btn.dataset.songName;
        const singerName = btn.dataset.singerName;

        if (!songId) {
            showErrorTip("歌曲ID为空，无法播放！");
            return;
        }

        playSong({
            songId: songId,
            songName: songName || "未知歌曲",
            singerName: singerName || "未知歌手"
        });
    }

    // ===================== 页面交互逻辑 =====================
    // 5. 搜索功能
    function openSearch() {
        const searchUrl = `/music/api/rank/sou?token=${encodeURIComponent(token)}&category=${category}&userId=${userId}`;
        window.location.href = searchUrl;
    }

    // 6. 分页
    function goToPage(page) {
        if (isNaN(page) || page < 1) return;
        const jumpUrl = `/music/api/rank/publish?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}&pageNum=${page}&pageSize=${pageSize}`;
        window.location.href = jumpUrl;
    }

    // ===================== 榜单点赞/收藏（修复 POST 参数格式）=====================
    function voteForRanking(rankId, btn) {
        console.log('切换榜单投票状态，rankId:', rankId);
        if (!token) {
            showErrorTip("请先登录后再投票！");
            return;
        }

        const voteCountEl = btn.querySelector('.vote-count');
        const originalCount = Number(voteCountEl.textContent) || 0;

        // 临时禁用按钮，添加加载状态
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.7';

        // ✅ 修复：POST 参数放在 data 中，params 只传通用参数
        axios.post(getTargetVotePath(category), null, { // 将 data 设为 null
            params: {
                token: token,
                rankId: rankId, // 将 rankId 也移到 params 中
                userId: userId
            }
        })
            .then(response => {
                if (response.data.code === 200 || response.data.success) {
                    if (btn.classList.contains('voted')) {
                        btn.classList.remove('voted');
                        voteCountEl.textContent = Math.max(0, originalCount - 1);
                        btn.querySelector('.heart-icon').textContent = '♡';
                        showSuccessTip("取消点赞成功！");
                    } else {
                        btn.classList.add('voted');
                        voteCountEl.textContent = originalCount + 1;
                        btn.querySelector('.heart-icon').textContent = '♥';
                        showSuccessTip("点赞成功！");
                    }
                } else {
                    voteCountEl.textContent = originalCount;
                    showErrorTip("操作失败：" + (response.data.msg || "后端处理失败"));
                }
            })
            .catch(error => {
                voteCountEl.textContent = originalCount;
                showErrorTip("操作失败：" + (error.response?.data?.msg || "接口异常"));
            })
            .finally(() => {
                // 无论成功失败，都恢复按钮状态
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
    }

    function collectRanking(rankId, btn) {
        console.log('切换榜单收藏状态，rankId:', rankId);
        if (!token) {
            showErrorTip("请先登录后再收藏！");
            return;
        }

        const collectCountEl = btn.querySelector('.collect-count');
        const originalCount = Number(collectCountEl.textContent) || 0;

        // 临时禁用按钮，添加加载状态
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.7';

        // ✅ 修复：POST 参数放在 data 中
        axios.post(getTargetLovePath(category), {
            rankId: rankId,
            userId: userId
        }, {
            params: { token: token }
        })
            .then(response => {
                if (response.data.code === 200 || response.data.success) {
                    if (btn.classList.contains('collected')) {
                        btn.classList.remove('collected');
                        collectCountEl.textContent = Math.max(0, originalCount - 1);
                        btn.querySelector('.star-icon').style.color = '';
                        showSuccessTip("取消收藏成功！");
                    } else {
                        btn.classList.add('collected');
                        collectCountEl.textContent = originalCount + 1;
                        btn.querySelector('.star-icon').style.color = '#fffa9c';
                        showSuccessTip("收藏成功！");
                    }
                } else {
                    collectCountEl.textContent = originalCount;
                    showErrorTip("操作失败：" + (response.data.msg || "后端处理失败"));
                }
            })
            .catch(error => {
                collectCountEl.textContent = originalCount;
                showErrorTip("操作失败：" + (error.response?.data?.msg || "接口异常"));
            })
            .finally(() => {
                // 无论成功失败，都恢复按钮状态
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
    }

    // ===================== 评论功能（修复时间格式化兼容）=====================

    // 新增：打开评论抽屉
    function openCommentDrawer(rankId) {
        console.log('打开评论抽屉, rankId:', rankId);
        const overlay = document.getElementById('commentDrawerOverlay');
        const panel = document.getElementById('commentDrawerPanel');
        const input = document.getElementById('drawerCommentInput');

        if (!overlay || !panel) {
            showErrorTip("评论抽屉组件未找到！");
            return;
        }

        // 设置当前 rankId
        panel.dataset.currentRankId = rankId;

        // 清空输入框
        if (input) input.value = '';

        // 显示遮罩和面板
        overlay.classList.add('active');
        panel.classList.add('active');

        // 禁止背景滚动
        document.body.style.overflow = 'hidden';

        // 加载评论数据
        loadCommentsToDrawer(rankId);
    }

    // 新增：关闭评论抽屉
    function closeCommentDrawer() {
        console.log('关闭评论抽屉');
        const overlay = document.getElementById('commentDrawerOverlay');
        const panel = document.getElementById('commentDrawerPanel');

        if (overlay && panel) {
            overlay.classList.remove('active');
            panel.classList.remove('active');
        }

        // 恢复背景滚动
        document.body.style.overflow = '';

        // 清除当前 rankId
        if (panel) panel.dataset.currentRankId = '';
    }

    // 修改：toggleComments 改为调用抽屉
    function toggleComments(rankId) {
        const panel = document.getElementById('commentDrawerPanel');

        if (panel && panel.classList.contains('active') && panel.dataset.currentRankId === String(rankId)) {
            // 如果当前已经打开且是同一个榜单，则关闭
            closeCommentDrawer();
        } else {
            // 否则打开/切换到该榜单的评论
            openCommentDrawer(rankId);
        }
    }

    // 修改：加载评论到抽屉容器
    function loadCommentsToDrawer(rankId) {
        console.log('加载评论列表到抽屉, rankId:', rankId);
        const commentList = document.getElementById('drawerCommentList');
        if (!commentList) return;

        if (!token) {
            commentList.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">请先登录后查看评论</p>';
            return;
        }

        commentList.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">加载中...</p>';

        axios.get(`/music/api/rank/list`, {
            params: {
                token: token,
                rankId: rankId,
                userId: userId
            }
        })
            .then(response => {
                console.log('加载评论响应:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    const comments = response.data.data || response.data;
                    renderCommentsToDrawer(commentList, comments);
                } else {
                    commentList.innerHTML = `<p style="color: #ff4444; text-align: center; padding: 20px;">查询评论失败：${response.data.msg || '未知错误'}</p>`;
                    console.error('评论查询失败:', response.data);
                }
            })
            .catch(error => {
                console.error('加载评论失败:', error);
                commentList.innerHTML = `<p style="color: #ff4444; text-align: center; padding: 20px;">加载评论失败：${error.response?.data?.msg || error.message}</p>`;
            });
    }

    // 兼容原有函数名（保留以防其他地方调用）
    function loadComments(rankId) {
        loadCommentsToDrawer(rankId);
    }

    // 修改：渲染评论到抽屉容器
    function renderCommentsToDrawer(container, comments) {
        if (!comments || comments.length === 0) {
            container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无评论</p>';
            return;
        }

        container.innerHTML = '';
        comments.forEach(comment => {
            const commentItem = document.createElement('div');
            commentItem.className = 'comment-item';
            commentItem.dataset.comId = comment.comId;
            commentItem.dataset.rankId = comment.rankId;
            commentItem.dataset.userId = comment.userId;
            commentItem.innerHTML = `
                <div class="comment-header">
                    <span class="comment-username">${comment.username || '匿名用户'}</span>
                    <span class="comment-time">${formatTime(comment.comTime)}</span>
                </div>
                <div class="comment-content">${comment.comContent || ''}</div>
                <div class="comment-actions-bar">
                    <button class="comment-like-btn ${comment.isLiked === 1 ? 'liked' : ''}" data-com-id="${comment.comId}">
                        <span class="comment-heart-icon">♥</span>
                        <span class="comment-like-count">${comment.likeCount || 0}</span>
                    </button>
                    ${comment.userId === parseInt(userId) ?
                `<button class="comment-delete-btn" data-com-id="${comment.comId}" data-rank-id="${comment.rankId}">删除</button>` : ''
            }
                </div>
            `;

            container.appendChild(commentItem);
        });
    }

    // 兼容原有函数名
    function renderComments(container, comments) {
        renderCommentsToDrawer(container, comments);
    }

    // 修改：从抽屉输入框提交评论
    function submitComment(rankId) {
        console.log('提交评论, rankId:', rankId);

        // 优先从抽屉输入框获取内容
        let input = null;
        const panel = document.getElementById('commentDrawerPanel');
        if (panel && panel.classList.contains('active')) {
            input = document.getElementById('drawerCommentInput');
        }

        // 如果抽屉未打开或输入框不存在，尝试使用原有的输入框（降级方案）
        if (!input) {
            input = document.getElementById(`comment-input-${rankId}`);
        }

        if (!input) {
            showErrorTip("评论输入框未找到！");
            return;
        }

        const content = input.value.trim();

        if (!content) {
            showErrorTip("评论内容不能为空！");
            return;
        }

        if (!token || !userId || isNaN(userId)) {
            showErrorTip("请先登录后再评论！");
            return;
        }

        axios.post(`/music/api/rank/pubcomment`, {
            rankId: rankId,
            userId: userId,
            content: content,
            parentId: null
        }, {
            params: { token: token }
        })
            .then(response => {
                console.log('提交评论成功:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    showSuccessTip("评论发表成功！");
                    input.value = '';
                    loadComments(rankId);
                } else {
                    showErrorTip("评论发表失败：" + (response.data.msg || '未知错误'));
                }
            })
            .catch(error => {
                console.error('提交评论失败:', error);
                showErrorTip("评论发表失败：" + (error.response?.data?.msg || error.message));
            });
    }

    // ✅ 核心修复：评论点赞接口参数格式（后端要求@RequestParam，所以参数要放在params里）
    function toggleCommentLike(commentId, btn) {
        console.log('切换评论点赞状态，commentId:', commentId);

        if (!token) {
            showErrorTip("请先登录后再点赞！");
            return;
        }

        const likeCountEl = btn.querySelector('.comment-like-count');
        const originalCount = Number(likeCountEl.textContent) || 0;

        // 临时禁用按钮
        btn.style.pointerEvents = 'none';

        if (btn.classList.contains('liked')) {
            // 取消点赞 - ✅ 修复：参数放在params中（后端@RequestParam要求）
            axios.post(`/music/api/rank/deleteLike`, null, {
                params: {
                    token: token,
                    comId: commentId // 后端参数名是comId，必须匹配
                }
            })
                .then(response => {
                    console.log('取消点赞完整响应:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        btn.classList.remove('liked');
                        likeCountEl.textContent = Math.max(0, originalCount - 1);
                        showSuccessTip("取消点赞成功！");
                    } else {
                        showErrorTip("取消点赞失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('取消点赞失败:', error);
                    showErrorTip("取消点赞失败：" + (error.response?.data?.msg || error.message));
                })
                .finally(() => {
                    btn.style.pointerEvents = 'auto';
                });
        } else {
            // 点赞 - ✅ 修复：参数放在params中（后端@RequestParam要求）
            axios.post(`/music/api/rank/like`, null, {
                params: {
                    token: token,
                    comId: commentId // 后端参数名是comId，必须匹配
                }
            })
                .then(response => {
                    console.log('点赞成功:', response.data);
                    if (response.data.code === 200 || response.data.success) {
                        btn.classList.add('liked');
                        likeCountEl.textContent = originalCount + 1;
                        showSuccessTip("点赞成功！");
                    } else {
                        showErrorTip("点赞失败：" + (response.data.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('点赞失败:', error);
                    showErrorTip("点赞失败：" + (error.response?.data?.msg || error.message));
                })
                .finally(() => {
                    btn.style.pointerEvents = 'auto';
                });
        }
    }

    function deleteComment(commentId, rankId) {
        console.log('删除评论，commentId:', commentId);

        if (!confirm('确定要删除这条评论吗？')) {
            return;
        }

        axios.delete(`/music/api/rank/deleteComment`, {
            params: {
                token: token,
                comId: commentId,
                userId: userId
            }
        })
            .then(response => {
                console.log('删除评论成功:', response.data);
                if (response.data.code === 200 || response.data.success) {
                    showSuccessTip("删除评论成功！");
                    if (rankId) {
                        loadComments(rankId);
                    }
                } else {
                    showErrorTip("删除评论失败：" + (response.data.msg || '未知错误'));
                }
            })
            .catch(error => {
                console.error('删除评论失败:', error);
                showErrorTip("删除评论失败：" + (error.response?.data?.msg || error.message));
            });
    }

    // ✅ 修复：时间格式化兼容低版本浏览器
    function formatTime(time) {
        if (!time) return '';
        const date = new Date(time);
        if (isNaN(date.getTime())) return '未知时间';
        const year = date.getFullYear();
        const month = padStartCompat(date.getMonth() + 1, 2, '0');
        const day = padStartCompat(date.getDate(), 2, '0');
        const hour = padStartCompat(date.getHours(), 2, '0');
        const minute = padStartCompat(date.getMinutes(), 2, '0');
        return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    // ===================== 全局事件委托（核心修复：统一绑定所有按钮事件）=====================
    function bindAllEvents() {
        // 事件委托：处理所有按钮点击
        document.addEventListener('click', function(e) {
            const target = e.target;

            // 1. 搜索按钮
            if (target.closest('#searchButton')) {
                openSearch();
                return;
            }

            // 2. 播放按钮
            const playBtn = target.closest('.play-btn');
            if (playBtn) {
                playSongFromData(playBtn);
                return;
            }

            // 3. 投票按钮
            const voteBtn = target.closest('.vote-btn');
            if (voteBtn) {
                const rankId = voteBtn.dataset.rankId;
                if (rankId) {
                    voteForRanking(rankId, voteBtn);
                }
                return;
            }

            // 4. 收藏按钮
            const collectBtn = target.closest('.collect-btn');
            if (collectBtn) {
                const rankId = collectBtn.dataset.rankId;
                if (rankId) {
                    collectRanking(rankId, collectBtn);
                }
                return;
            }

            // AI锐评按钮点击（预留接口）
            const aiReviewBtn = target.closest('.ai-review-btn');
            if (aiReviewBtn) {
                const rankId = aiReviewBtn.dataset.rankId;
                showSuccessTip("AI锐评功能即将上线！");
                console.log("AI锐评:", rankId);
                return;
            }

            // 5. 评论切换按钮
            const commentToggle = target.closest('.comment-toggle');
            if (commentToggle) {
                const rankId = commentToggle.dataset.rankId;
                if (rankId) {
                    toggleComments(rankId);
                }
                return;
            }

            // 5.1 抽屉关闭按钮
            const drawerCloseBtn = target.closest('#drawerCloseBtn');
            if (drawerCloseBtn) {
                closeCommentDrawer();
                return;
            }

            // 5.2 抽屉遮罩层点击关闭
            const drawerOverlay = target.closest('#commentDrawerOverlay');
            if (drawerOverlay && target === drawerOverlay) {
                closeCommentDrawer();
                return;
            }

            // 6. 评论提交按钮（兼容原有 + 抽屉提交）
            const commentSubmit = target.closest('.comment-submit');
            const drawerSubmit = target.closest('#drawerSubmitBtn');
            if (commentSubmit || drawerSubmit) {
                let rankId = null;
                if (drawerSubmit) {
                    // 从抽屉面板获取当前 rankId
                    const panel = document.getElementById('commentDrawerPanel');
                    rankId = panel ? panel.dataset.currentRankId : null;
                } else {
                    rankId = commentSubmit.dataset.rankId;
                }
                if (rankId) {
                    submitComment(rankId);
                }
                return;
            }

            // 7. 评论点赞按钮
            const commentLikeBtn = target.closest('.comment-like-btn');
            if (commentLikeBtn) {
                const comId = commentLikeBtn.dataset.comId;
                if (comId) {
                    toggleCommentLike(comId, commentLikeBtn);
                }
                return;
            }

            // 8. 评论删除按钮
            const commentDeleteBtn = target.closest('.comment-delete-btn');
            if (commentDeleteBtn) {
                const comId = commentDeleteBtn.dataset.comId;
                const rankId = commentDeleteBtn.dataset.rankId;
                if (comId && rankId) {
                    deleteComment(comId, rankId);
                }
                return;
            }

            // 9. 分页按钮
            const pageBtn = target.closest('.page-btn');
            if (pageBtn && !pageBtn.disabled) {
                const page = pageBtn.dataset.page;
                if (page) {
                    goToPage(parseInt(page));
                }
                return;
            }

            // 10. 加号发布按钮
            if (target.closest('#addBtn')) {
                if (!token || !userId || !category || isNaN(userId) || isNaN(category)) {
                    showErrorTip("参数缺失，请刷新页面重试！");
                    return;
                }
                let addPagePath = category === 1 ? "/music/rank.html" : "/music/workrank.html";
                const jumpUrl = `${addPagePath}?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}`;
                console.log("发布跳转URL：", jumpUrl);
                window.location.href = jumpUrl;
                return;
            }

            // 11. 我的榜单按钮
            if (target.closest('#myRankBtn')) {
                console.log("【进入我的榜单】按钮被点击");
                if (!token || !userId || isNaN(userId)) {
                    showErrorTip("缺少登录信息，请重新登录！");
                    setTimeout(() => window.location.href = "/login.html", 1500);
                    return;
                }
                const targetPath = getTargetPublishPath(category);
                const jumpUrl = `${targetPath}?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}&pageNum=1&pageSize=10`;
                console.log("跳转URL：", jumpUrl);
                window.location.href = jumpUrl;
                return;
            }

            // 12. 热门榜单按钮
            if (target.closest('#hotRankBtn')) {
                console.log("【热门榜单】按钮被点击");
                if (!token || !userId || isNaN(userId)) {
                    showErrorTip("缺少登录信息，请重新登录！");
                    setTimeout(() => window.location.href = "/login.html", 1500);
                    return;
                }
                const hotRankUrl = `/music/hotrank.html?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}`;
                console.log("热门榜单跳转URL：", hotRankUrl);
                window.location.href = hotRankUrl;
                return;
            }

            // 13. 返回登录按钮
            if (target.closest('#loginBtn')) {
                console.log("【返回登录】按钮被点击");
                window.location.href = "/music/login.html";
                return;
            }

            // 14. 侧边栏展开/收起按钮
            if (target.closest('#slideBtnToggle')) {
                const toggleBtn = document.getElementById('slideBtnToggle');
                const myRankBtn = document.getElementById('myRankBtn');
                const hotRankBtn = document.getElementById('hotRankBtn');
                const isExpanded = !toggleBtn.classList.contains('collapsed');

                if (isExpanded) {
                    toggleBtn.classList.remove('expanded');
                    toggleBtn.classList.add('collapsed');
                    myRankBtn.classList.remove('show');
                    hotRankBtn.classList.remove('show');
                } else {
                    toggleBtn.classList.remove('collapsed');
                    toggleBtn.classList.add('expanded');
                    myRankBtn.classList.add('show');
                    hotRankBtn.classList.add('show');
                }
                return;
            }

            // 15. 登录栏展开/收起按钮
            if (target.closest('#loginBtnToggle')) {
                const toggleBtn = document.getElementById('loginBtnToggle');
                const loginBtn = document.getElementById('loginBtn');
                const isExpanded = !toggleBtn.classList.contains('collapsed');

                if (isExpanded) {
                    toggleBtn.classList.remove('expanded');
                    toggleBtn.classList.add('collapsed');
                    loginBtn.classList.remove('show');
                } else {
                    toggleBtn.classList.remove('collapsed');
                    toggleBtn.classList.add('expanded');
                    loginBtn.classList.add('show');
                }
                return;
            }

            // 16. 左侧导航栏切换按钮
            if (target.closest('.nav-toggle-btn')) {
                const sidebar = document.querySelector('.left-sidebar');
                sidebar.classList.toggle('collapsed');
                return;
            }

            // 17. 主页按钮（当前页面，无需跳转）
            if (target.closest('#navHome')) {
                document.querySelectorAll('.nav-circle-btn').forEach(btn => btn.classList.remove('active'));
                target.closest('#navHome').classList.add('active');
                return;
            }

            // 17.5 首页按钮（跳转 index.html）
            if (target.closest('#navIndex')) {
                const indexUrl = `/music/index.html?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}`;
                window.location.href = indexUrl;
                return;
            }

            // 18. 搜索按钮
            if (target.closest('#navSearch')) {
                openSearch();
                return;
            }

            // 19. 我的榜单按钮
            if (target.closest('#navMyRank')) {
                const myRankBtn = document.getElementById('myRankBtn');
                if (myRankBtn) myRankBtn.click();
                return;
            }

            // 20. 热门榜单按钮
            if (target.closest('#navHotRank')) {
                const hotRankBtn = document.getElementById('hotRankBtn');
                if (hotRankBtn) hotRankBtn.click();
                return;
            }

            // 21. 我的收藏按钮（跳转 mylove-page.html）
            if (target.closest('#navMyLove')) {
                const myLoveUrl = `/music/api/mine/mylove?token=${encodeURIComponent(token)}&userId=${userId}&category=${category}&pageNum=1`;
                window.location.href = myLoveUrl;
                return;
            }

            // 22. 发布榜单按钮
            if (target.closest('#navAdd')) {
                const addBtn = document.getElementById('addBtn');
                if (addBtn) addBtn.click();
                return;
            }
        });
    }

    // ===================== 页面加载完成后初始化 =====================
    document.addEventListener('DOMContentLoaded', function() {
        console.log("DOM加载完成，开始初始化页面");

        // 1. 初始化播放器
        initMusicPlayer();

        // 2. 绑定所有事件（核心修复）
        bindAllEvents();

        // 3. 添加 ESC 键关闭抽屉功能
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                const panel = document.getElementById('commentDrawerPanel');
                if (panel && panel.classList.contains('active')) {
                    closeCommentDrawer();
                }
            }
        });

        // 4. 页面加载校验
        if (!token || token.trim() === '' || !userId || isNaN(userId)) {
            showErrorTip("登录信息失效，请重新登录！");
            setTimeout(() => window.location.href = "/music.html", 1500);
            return;
        }

        console.log("页面加载成功");
    });

</script>
