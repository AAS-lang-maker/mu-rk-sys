# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /music
  tomcat:
    max-http-form-post-size: 100MB

debug: true

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    cache: false
    mode: HTML

  datasource:
    url: jdbc:mysql://localhost:3306/music_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 280939
    driver-class-name: com.mysql.cj.jdbc.Driver


  # 文件上传配置（正确！）
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

redis:
  host: 172.17.211.108
  port: 63790
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0

# MyBatis
mybatis:
  type-aliases-package: com.music.pojo
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 分页
pagehelper:
  helper-dialect: mysql
  support-methods-arguments: false
  reasonable: false

# 文件路径
music:
  file:
    path: D:/music/music_files/

