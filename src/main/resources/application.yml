# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /music
  tomcat:
    max-http-form-post-size: 100MB

debug: true

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    cache: false
    mode: HTML
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL8.0驱动（5.7用com.mysql.jdbc.Driver）
    url: jdbc:mysql://localhost:3306/music_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root  # 你的MySQL账号（默认root）
    # 解释：localhost=本地数据库，3306=MySQL默认端口，music_db=你的数据库名（需自己在MySQL中建）
    password: "123456" # 你的MySQL密码



  # 文件上传配置（正确！）
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

redis:
  host: 172.17.211.108
  port: 6379
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0

# MyBatis
mybatis:
  type-aliases-package: com.music.pojo
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 分页
pagehelper:
  helper-dialect: mysql
  support-methods-arguments: false
  reasonable: false

# 文件路径
music:
  file:
    path: D:/music/music_files/
langchain4j:
  open-ai:
# 1. 基础对话配置
    chat-model:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${siliconflow.api-key}
      model-name: deepseek-ai/DeepSeek-V3
# 2. 流式跳动配置 (必须配这个，大管家才能“蹦字”)
    streaming-chat-model:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${siliconflow.api-key}
      model-name: deepseek-ai/DeepSeek-V3

siliconflow:
  api-key: sk-scfyywuvogbtzbjclasankvpfxwzccdvecbfkuaksmxjbgam

# ... (前面的配置保持不变) ...


