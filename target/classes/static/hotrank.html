<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 先引Axios，再引播放器JS（和搜索页加载顺序完全一致） -->

     <link rel="icon" href="data:;base64,iVBORw0KGgo">
    <link rel="stylesheet" href="/music/player/music-player.css">
    <title>热门榜单</title>
    <style>
        /* 全局样式：完全复制搜索页的CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Arial', sans-serif;
        }

        body {
            background-color: #0f172a;
            background-image:
                    linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            padding-bottom: 120px;
            position: relative;
            padding-left: 170px;
            padding-right: 170px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 36px;
            color: #fffa9c;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 18px;
            color: rgba(247, 250, 252, 0.7);
        }

        /* 原有搜索按钮样式保留 */
        .top-right-search {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 100;
        }

        .search-button {
            width: 70px;
            height: 70px;
            background: #1E293B;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .search-button:hover {
            transform: scale(1.1);
            background: rgba(255, 250, 156, 0.2);
            border-color: #fffa9c;
            box-shadow: 0 0 20px rgba(255, 250, 156, 0.5);
        }

        .search-results {
            background: rgba(30, 41, 59, 0.6);

            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);

        }

        .results-header {
            margin-bottom: 30px;
            padding-bottom: 20px;

        }

        .results-header h2 {

            font-weight: 600;
        }

        .results-header p {

            font-size: 15px;
        }

        .ranking-header {
            display: flex;

            align-items: center;
            margin-bottom: 10px;
        }

        /* 排名序号样式 */
        .rank-info {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .rank-num {
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            background: #f89159;
            color: white;
            border-radius: 50%;

            flex-shrink: 0;
        }

        .publisher-btn {

            border-radius: 6px;

        .publisher-btn:hover {

        .ranking-item {
            background: rgba(255, 255, 255, 0.05);

        .ranking-item:hover {

            transform: translateX(10px);

        .ranking-item h3 {

        }

        .ranking-meta {

        .song-list {
            margin-top: 15px;
            padding-left: 0;
        }

        .song-list h4 {
            color: #fffa9c;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .song-list ul {
            list-style: none;
            padding: 0;

            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(255, 250, 156, 0.05);

        .song-list li {
            margin: 8px 0;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 250, 156, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .song-list li:last-child {
            border-bottom: none;
        }

        .song-list li:hover {

            border-radius: 4px;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;

        }

        .song-name {

            font-size: 15px;

        .singer-name {

            font-size: 15px;

        .song-rank {
            color: #fffa9c;
            font-size: 15px;
            font-weight: 600;

            background: rgba(255, 250, 156, 0.1);

        /* 播放按钮样式（和搜索页完全一致） */
        .play-btn {
            background: rgba(255, 250, 156, 0.2);
            border: 1px solid #fffa9c;
            color: #fffa9c;

            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;

            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

        .comment-time {

        }

<!-- 主容器 -->
< class="container">
    <!-- 原有搜索按钮 -->
    <div class="top-right-search">
        <button class="search-button" onclick="openSearch()">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">

<script>
    // ===================== 工具函数（和搜索页完全一致） =====================
    function getUrlParam(paramName) {
        const reg = new RegExp("(^|&)" + paramName + "=([^&]*)(&|$)");
        const paramMatch = window.location.search.substr(1).match(reg);
        return paramMatch ? decodeURIComponent(paramMatch[2]) : null;
    }

    function getUserIdFromToken(token) {
        if (!token) return null;
        try {
            const payload = token.split('.')[1];
            const decodedPayload = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
            const payloadObj = JSON.parse(decodedPayload);
            return payloadObj.userId || payloadObj.uid || null;
        } catch (error) {
            console.error("解析Token失败:", error);
            return null;
        }
    }

    function showErrorTip(msg) {
        const el = document.getElementById('errorAlert');
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    function showSuccessTip(msg) {
        const el = document.getElementById('successAlert');
        el.innerText = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    function padStartCompat(str, length, padChar) {
        str = str.toString();
        while (str.length < length) {
            str = padChar + str;
        }
        return str;
    }

    function formatTime(time) {
        if (!time) return '';
        const date = new Date(time);
        if (isNaN(date.getTime())) return '未知时间';
        const year = date.getFullYear();
        const month = padStartCompat(date.getMonth() + 1, 2, '0');
        const day = padStartCompat(date.getDate(), 2, '0');
        const hour = padStartCompat(date.getHours(), 2, '0');
        const minute = padStartCompat(date.getMinutes(), 2, '0');
        return `${year}-${month}-${day} ${hour}:${minute}`;
    }

        console.log('投票操作，rankId:', rankId);
        if (!token) {
            showErrorTip("请先登录后再投票！");
            return;
        }

        const voteCountEl = btn.querySelector('.vote-count');
        const originalCount = Number(voteCountEl.textContent) || 0;
        btn.disabled = true;

        // 判断是否已点赞
        const isVoted = btn.classList.contains('voted');
        const url = isVoted
            ? (category === 1 ? "/music/api/rank/deleteVote" : "/music/api/workrank/deleteVote")
            : getTargetVotePath(category);

        axios.post(url, null, {
            params: { token: token, rankId: rankId, userId: userId }
        })
            .then(response => {
                btn.disabled = false;
                if (response.data.code === 200 || response.data.success) {
                    if (isVoted) {
                        btn.classList.remove('voted');
                        voteCountEl.textContent = Math.max(0, originalCount - 1);
                        btn.querySelector('.heart-icon').textContent = '♡';
                        showSuccessTip("取消点赞成功！");
                    } else {
                        btn.classList.add('voted');
                        voteCountEl.textContent = originalCount + 1;
                        btn.querySelector('.heart-icon').textContent = '♥';
                        showSuccessTip("点赞成功！");
                    }
                } else {
                    voteCountEl.textContent = originalCount;
                    showErrorTip((isVoted ? "取消点赞" : "点赞") + "失败：" + (response.data.msg || "后端处理失败"));
                }
            })
            .catch(error => {
                btn.disabled = false;
                voteCountEl.textContent = originalCount;
                showErrorTip((isVoted ? "取消点赞" : "点赞") + "失败：" + (error.response?.data?.msg || "接口异常"));
            });
    }

            commentItem.innerHTML = `

    // 加载所有榜单数据
    async function loadAllRankData() {
        document.getElementById("loading").style.display = "block";
        try {
            const response = await axios.get(`${config.baseUrl}${config.hotRankApi}`, {
                params: { token: token, userId: userId },
                timeout: 10000
            });

            const resData = response.data;
            if (resData.code !== 200 && resData.code !== 0) {
                if (resData.code === 401) {
                    showErrorTip("登录过期，请重新登录");
                    setTimeout(() => window.location.href = config.loginUrl, 2000);
                } else {
                    showErrorTip("加载失败：" + resData.msg);
                }
                return;
            }

            const rawList = resData.data || [];
            if (rawList.length === 0) {
                document.getElementById("emptyState").style.display = "block";
                return;
            }

            // 按热度排序
            const rankList = rawList.sort((a, b) => {
                const hotA = (a.voteCount || a.vote_count || 0) + (a.loveCount || a.love_count || 0);
                const hotB = (b.voteCount || b.vote_count || 0) + (b.loveCount || b.love_count || 0);
                return hotB - hotA;
            });

            // 渲染榜单
            const rankListDom = document.getElementById("rankList");
            rankListDom.innerHTML = '';
            renderRankList(rankList);
        } catch (error) {
            document.getElementById("emptyState").style.display = "block";
            if (error.response && error.response.status === 401) {
                showErrorTip("Token失效，请重新登录");
                setTimeout(() => window.location.href = config.loginUrl, 2000);
            } else {
                showErrorTip("加载失败：网络异常");
            }
            console.error("榜单加载失败：", error);
        } finally {
            document.getElementById("loading").style.display = "none";
        }
    }

            const voteCount = Number(rank.voteCount || rank.vote_count || 0);

            const songList = rank.rankSongList || rank.rank_song_list || [];

                    const songName = song.songName || song.song_name;
                    const singerName = song.singerName || song.singer_name;
                    const ranking = Number(song.ranking || song.rank || 0);

                    songsHtml += `
                        <li>
                            <div class="song-info">
                                <span class="song-rank">${ranking > 0 ? ranking : "无排名"}</span>
                                <span class="song-name">${songName}</span>
                                <span class="singer-name">${singerName}</span>
                                <!-- 播放按钮（和搜索页完全一致） -->
                                <button class="play-btn"
                                        data-song-id="${songId}"
                                        data-song-name="${songName}"
                                        data-singer-name="${singerName}">
                                    &#9658;
                                </button>
                            </div>
                        </li>
                    `;
                });
            }
            songsHtml += '</ul>';

            // 拼接榜单项
            const li = document.createElement("li");
            li.className = "ranking-item";
            li.innerHTML = `
                <div class="ranking-header">
                    <div class="rank-info">
                        <div class="rank-num">${rankNum}</div>
                        <div>
                            <h3>${rankName}</h3>
                            <div class="ranking-meta">
                                <span>更新时间：${formatTime(publishTime)}</span>
                                <span>热度：${voteCount + loveCount}</span>
                            </div>
                        </div>
                    </div>
                    <button class="publisher-btn">发布人：${username}</button>
                </div>
                <div class="song-list">${songsHtml}</div>

                <!-- 榜单点赞/收藏 -->
                <div class="rank-actions">
                    <button class="vote-btn ${rank.isVoted ? 'voted' : ''}" data-rank-id="${rankId}">
                        <span class="heart-icon">${rank.isVoted ? '♥' : '♡'}</span>
                        <span class="vote-count">${voteCount}</span>
                    </button>
                    <button class="collect-btn ${rank.isCollected ? 'collected' : ''}" data-rank-id="${rankId}">
                        <span class="star-icon">★</span>
                        <span class="collect-count">${loveCount}</span>
                    </button>
                </div>

                <!-- 评论区 -->
                <div class="comment-section">
                    <button class="comment-toggle" data-rank-id="${rankId}">查看评论</button>
                    <div class="comment-container" id="comment-container-${rankId}">
                        <div class="comment-input-area">
                            <textarea class="comment-input" id="comment-input-${rankId}" placeholder="写下你的评论..."></textarea>
                            <div class="comment-actions">
                                <button class="comment-submit" data-rank-id="${rankId}">发表评论</button>
                            </div>
                        </div>
                        <div class="comment-list" id="comment-list-${rankId}"></div>
                    </div>
                </div>
            `;
            rankListDom.appendChild(li);
        });
    }

</script>
</body>
</html>
